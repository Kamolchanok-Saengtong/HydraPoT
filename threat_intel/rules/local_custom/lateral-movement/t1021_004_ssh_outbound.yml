id: fef8937d-495d-4508-99fe-ee5b9209b44d
title: 'Remote Services: SSH'
status: stable
description: >-
  An outbound SSH session or copy is started FROM the honeypot -- the
  attacker pivoting onward. The local sshd daemon being managed is not
  lateral movement and is excluded; `scp -t`/`scp -f` are the receiving
  ends of an INBOUND copy and are excluded too (that is T1105).
references:
  - https://attack.mitre.org/techniques/T1021/004
  - https://github.com/redcanaryco/atomic-red-team  # 2 Linux atomic(s)
author: HydraPoT
date: 2026-09-20
technique: T1021.004
technique_name: 'SSH'
tactic: 'Lateral Movement'
priority: 30
confidence: medium
# DERIVATION. SigmaHQ's imported Linux rules detect 0 of this technique's
# Atomic Red Team Linux atomics: their detection is written against EDR
# process-creation fields (Image, ParentImage, TargetFilename) that an SSH
# honeypot cannot emit. MITRE ATT&CK defines the behaviour; ART's atomics
# supply the command forms this pattern is written against.
logsource:
  product: cowrie
  category: command
detection:
  selection:
    segment|re:
      - '^\s*(?:sudo\s+)?ssh\s+\S+@\S'
      - '^\s*(?:sudo\s+)?(?:scp|sftp)\s+\S+@\S'
      - '^\s*(?:sudo\s+)?ssh\s+(?:-\w+\s+\S+\s+)*\S+\s+\S'
  filter_local_daemon:
    command|re:
      - '/etc/init\.d/sshd?\b'
      - '\b(?:systemctl|service|invoke-rc\.d|rc-service|chkconfig)\b[^|;]*\bsshd?\b'
      - '\bssh\s+(?:start|stop|restart|reload|status|enable|disable)\b'
  filter_inbound_scp:
    command|re:
      - '^\s*scp\s+(?:-\w+\s+)*-[tf]\b'
  condition: selection and not 1 of filter_*
tags:
  - attack.lateral-movement
  - attack.t1021.004
