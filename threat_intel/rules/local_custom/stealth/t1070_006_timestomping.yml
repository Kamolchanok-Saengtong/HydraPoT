id: 9583edac-d35a-415c-b327-956910f81f7e
title: 'Indicator Removal: Timestomp'
status: stable
description: >-
  File or system timestamps are rewritten so the attacker's activity does
  not stand out in a time-ordered listing. ART covers both directions:
  `touch -t/-d/-r` on a file, and setting the SYSTEM clock with `date
  010100001971` so newly created files inherit a false time.
references:
  - https://attack.mitre.org/techniques/T1070/006
  - https://github.com/redcanaryco/atomic-red-team  # 4 Linux atomic(s)
author: HydraPoT
date: 2026-09-20
technique: T1070.006
technique_name: 'Timestomp'
tactic: 'Stealth'
priority: 20
confidence: high
# DERIVATION. SigmaHQ's imported Linux rules detect 0 of this technique's
# Atomic Red Team Linux atomics: their detection is written against EDR
# process-creation fields (Image, ParentImage, TargetFilename) that an SSH
# honeypot cannot emit. MITRE ATT&CK defines the behaviour; ART's atomics
# supply the command forms this pattern is written against.
logsource:
  product: cowrie
  category: command
detection:
  selection_touch:
    segment|re:
      - '^\s*(?:sudo\s+)?touch\s+(?:-\w+\s+)*-[a-z]*[amdtr]'
      - '^\s*(?:sudo\s+)?touch\s+(?:-\w+\s+)*--(?:date|reference|time)\b'
  selection_clock:
    command|re:
      - '^\s*(?:sudo\s+)?date\s+(?:-s\s+)?[\x27"]?\d{8,12}'
      - '^\s*(?:sudo\s+)?date\s+-s\b'
      - '\btimedatectl\s+set-time\b'
  condition: 1 of selection*
tags:
  - attack.stealth
  - attack.t1070.006
