id: 64f2143a-e81a-49f4-845f-c1492c7e552f
title: 'Indicator Removal: File Deletion'
status: stable
description: >-
  The attacker removes the files they dropped. Scoped deletion only -- `rm
  -rf /` and equivalents are mass destruction (T1485) and are excluded by
  filter_mass so the two claims stay separate.
references:
  - https://attack.mitre.org/techniques/T1070/004
  - https://github.com/redcanaryco/atomic-red-team  # 4 Linux atomic(s)
author: HydraPoT
date: 2026-09-20
technique: T1070.004
technique_name: 'File Deletion'
tactic: 'Stealth'
priority: 60
confidence: high
# DERIVATION. SigmaHQ's imported Linux rules detect 0 of this technique's
# Atomic Red Team Linux atomics: their detection is written against EDR
# process-creation fields (Image, ParentImage, TargetFilename) that an SSH
# honeypot cannot emit. MITRE ATT&CK defines the behaviour; ART's atomics
# supply the command forms this pattern is written against.
logsource:
  product: cowrie
  category: command
detection:
  selection:
    segment|re:
      - '^\s*(?:sudo\s+)?rm\s+-\w*[rf]'
      - '^\s*(?:sudo\s+)?(?:shred|unlink)\s+\S'
  condition: selection
tags:
  - attack.stealth
  - attack.t1070.004
