id: 331b999c-4741-492c-8cc5-e7b0c01caf45
title: 'Rootkit'
status: stable
description: >-
  A shared object is registered for preloading into every process, or a
  kernel module is inserted -- the classic Linux process-hiding rootkit.
  ART's atomic appends libprocesshider.so to /etc/ld.so.preload.
references:
  - https://attack.mitre.org/techniques/T1014
  - https://github.com/redcanaryco/atomic-red-team  # 3 Linux atomic(s)
author: HydraPoT
date: 2026-09-20
technique: T1014
technique_name: 'Rootkit'
tactic: 'Stealth'
priority: 10
confidence: high
# DERIVATION. SigmaHQ's imported Linux rules detect 0 of this technique's
# Atomic Red Team Linux atomics: their detection is written against EDR
# process-creation fields (Image, ParentImage, TargetFilename) that an SSH
# honeypot cannot emit. MITRE ATT&CK defines the behaviour; ART's atomics
# supply the command forms this pattern is written against.
logsource:
  product: cowrie
  category: command
detection:
  selection_preload:
    command|re:
      - '(?:>>?|\btee\b(?:\s+-\w+)*)\s*\S*/etc/ld\.so\.preload\b'
      - '\bLD_PRELOAD\s*='
      - '\b(?:cat|less|rm)\b[^|;]*/etc/ld\.so\.preload\b'
  selection_module:
    segment|re:
      - '^\s*(?:sudo\s+)?(?:insmod|modprobe)\s+\S'
  condition: 1 of selection*
tags:
  - attack.stealth
  - attack.t1014
