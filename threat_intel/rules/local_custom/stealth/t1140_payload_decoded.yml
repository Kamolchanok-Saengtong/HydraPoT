id: 015007fe-9cc0-4613-8a49-577421a8b0e9
title: 'Deobfuscate/Decode Files or Information'
status: stable
description: >-
  An encoded payload is turned back into something runnable. ART's
  uncovered atomics cover the encode side too (`| base64`, `xxd -ps`,
  `b64encode -r`, perl MIME::Base64), so both directions are matched -- an
  attacker staging an encoded blob and one unpacking it are the same step
  seen from either end.
references:
  - https://attack.mitre.org/techniques/T1140
  - https://github.com/redcanaryco/atomic-red-team  # 5 Linux atomic(s)
author: HydraPoT
date: 2026-09-20
technique: T1140
technique_name: 'Deobfuscate/Decode Files or Information'
tactic: 'Stealth'
priority: 20
confidence: high
# DERIVATION. SigmaHQ's imported Linux rules detect 0 of this technique's
# Atomic Red Team Linux atomics: their detection is written against EDR
# process-creation fields (Image, ParentImage, TargetFilename) that an SSH
# honeypot cannot emit. MITRE ATT&CK defines the behaviour; ART's atomics
# supply the command forms this pattern is written against.
logsource:
  product: cowrie
  category: command
detection:
  selection_shell:
    command|re:
      - '\bbase64\s+(?:-{1,2}[\w=-]+\s+)*-{1,2}(?:d\b|decode\b)'
      - '\bbase64\s+-\w*d\w*'
      - '\|\s*base64\b'
      - '\bb64(?:decode|encode)\b'
      - '\buudecode\b'
      - '\bxxd\s+-\w*(?:r|ps)\b'
      - '\bopenssl\s+(?:enc|base64)\b'
  selection_interpreter:
    command|re:
      - '\bbase64\s*\.\s*b64(?:decode|encode)\b'
      - '\bMIME::Base64\b'
      - '\b(?:decode|encode)_base64\b'
      - '\batob\s*\('
      - '\bbase64\.decodestring\b'
  condition: 1 of selection*
tags:
  - attack.stealth
  - attack.t1140
