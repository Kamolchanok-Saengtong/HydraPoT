id: 0101ab81-8ef0-43f6-8339-0aba9bacee71
title: 'Indicator Removal: Clear Command History'
status: stable
description: >-
  The shell history file is emptied or removed. ART's uncovered atomics
  are the truncation forms -- `cat /dev/null > ~/.bash_history`, `echo ""
  > ~/.bash_history`, `truncate -s 0` -- alongside `history -c`.
references:
  - https://attack.mitre.org/techniques/T1070/003
  - https://github.com/redcanaryco/atomic-red-team  # 8 Linux atomic(s)
author: HydraPoT
date: 2026-09-20
technique: T1070.003
technique_name: 'Clear Command History'
tactic: 'Stealth'
priority: 20
confidence: high
# DERIVATION. SigmaHQ's imported Linux rules detect 0 of this technique's
# Atomic Red Team Linux atomics: their detection is written against EDR
# process-creation fields (Image, ParentImage, TargetFilename) that an SSH
# honeypot cannot emit. MITRE ATT&CK defines the behaviour; ART's atomics
# supply the command forms this pattern is written against.
logsource:
  product: cowrie
  category: command
detection:
  selection_builtin:
    command|re:
      - '\bhistory\s+-c\b'
      - '\bhistory\s+-w\b'
  selection_truncate:
    command|re:
      - '\b(?:cat|echo|printf)\b[^|;]*>\s*\S*(?:\.bash_history|\.zsh_history|\.sh_history|\.history|\$HISTFILE)\b'
      - '^\s*:\s*>\s*\S*(?:\.bash_history|\.zsh_history|\.history|\$HISTFILE)\b'
      - '\btruncate\b[^|;]*-s\s*0\b[^|;]*(?:history|\.bash_history)'
      - '>\s*\S*(?:\.bash_history|\.zsh_history|\.sh_history|\.history)\b'
  # A leading space makes bash omit the command from history entirely --
  # nothing is written, so nothing needs clearing. `raw` is the only field that
  # still carries it; every other one has been stripped.
  selection_space_evasion:
    raw|re:
      - '^[ \t]+\S'
  selection_destroy:
    command|re:
      - '\b(?:rm|shred|unlink)\b[^|;]*(?:\.bash_history|\.zsh_history|\.sh_history|\.history|\$HISTFILE)\b'
      - '\bln\s+-\w*s\w*\s+/dev/null\s+\S*(?:\.bash_history|\.zsh_history|\.history)\b'
  condition: 1 of selection*
tags:
  - attack.stealth
  - attack.t1070.003
