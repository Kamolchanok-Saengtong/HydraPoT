id: 946265c9-c1e4-47f7-8083-b81ebacc27ac
title: Account password changed
status: stable
description: >-
  Anchored to passwd/chpasswd as the COMMAND. The previous \bpasswd\b rule also matched it as an argument, so `ls -la /etc/passwd | grep root` was tagged T1531.
references:
  - https://attack.mitre.org/techniques/T1531
author: HydraPoT
date: 2026-08-25
technique: T1531
technique_name: 'Account Access Removal'
tactic: 'Impact'
priority: 15
confidence: high
logsource:
  product: cowrie
  category: command
detection:
  selection:
    segment|re:
      - '^\s*(?:sudo\s+)?(?:passwd|chpasswd)\b'
      - '^\s*echo\b[^|;]*\|\s*(?:sudo\s+)?chpasswd\b'
  condition: selection
tags:
  - attack.impact
  - attack.t1531
