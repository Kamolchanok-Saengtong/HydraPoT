id: 399e4461-bbdc-4cfb-8241-500bdf980f6b
title: 'Service Stop'
status: stable
description: >-
  A running service or named process is brought down. ART's atomics use
  `systemctl stop cron`, `killall -SIGTERM cron`, `pkill -SIGTERM ^cron$`,
  `kill -SIGTERM $(pgrep cron)` and `echo "e" > /proc/sysrq-trigger`.
  Security tooling is excluded -- that is T1685, a different claim.
references:
  - https://attack.mitre.org/techniques/T1489
  - https://github.com/redcanaryco/atomic-red-team  # 5 Linux atomic(s)
author: HydraPoT
date: 2026-09-20
technique: T1489
technique_name: 'Service Stop'
tactic: 'Impact'
priority: 25
confidence: high
# DERIVATION. SigmaHQ's imported Linux rules detect 0 of this technique's
# Atomic Red Team Linux atomics: their detection is written against EDR
# process-creation fields (Image, ParentImage, TargetFilename) that an SSH
# honeypot cannot emit. MITRE ATT&CK defines the behaviour; ART's atomics
# supply the command forms this pattern is written against.
logsource:
  product: cowrie
  category: command
detection:
  selection_signal:
    segment|re:
      - '^\s*(?:sudo\s+)?(?:killall|pkill)\b\s+\S'
      - '^\s*(?:sudo\s+)?kill\b\s+(?:-\S+\s+)*(?:\$\(|`|\d)'
  selection_service:
    command|re:
      - '\b(?:systemctl|service|rc-service|invoke-rc\.d)\b[^|;]*\b(?:stop|kill)\b'
      - '^\s*/etc/init\.d/\S+\s+stop\b'
  selection_sysrq:
    command|re:
      - '\becho\s+[\x27"]?[ei][\x27"]?\s*>\s*/proc/sysrq-trigger'
  filter_security:
    command|re:
      - '\b(?:apparmor|auditd|audispd|selinux|falcon|cbdaemon|carbonblack|falco|systemd-journald|journald|rsyslog|syslog-ng|syslogd|syslog|fail2ban|ossec|wazuh|clamav|clamd|snort|suricata|osquery|amazon-ssm-agent|mdatp|sentinelone|auditbeat|filebeat|ufw|firewalld|ip6?tables|nftables)\b'
  condition: 1 of selection* and not filter_security
tags:
  - attack.impact
  - attack.t1489
