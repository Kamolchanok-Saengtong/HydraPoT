id: b44c3701-46a7-43c8-ad9e-c76526caa629
title: 'Event Triggered Execution: Unix Shell Configuration Modification'
status: stable
description: >-
  A shell startup file is appended to, so the payload runs on every future
  login. ART's atomics all take the same shape -- `echo ... >> <profile>`
  -- against ~/.bashrc, ~/.profile, ~/.bash_profile, /etc/profile and
  /etc/profile.d/. Reads are not matched; only writes establish this.
references:
  - https://attack.mitre.org/techniques/T1546/004
  - https://github.com/redcanaryco/atomic-red-team  # 7 Linux atomic(s)
author: HydraPoT
date: 2026-09-20
technique: T1546.004
technique_name: 'Unix Shell Configuration Modification'
tactic: 'Privilege Escalation'
priority: 20
confidence: high
# DERIVATION. SigmaHQ's imported Linux rules detect 0 of this technique's
# Atomic Red Team Linux atomics: their detection is written against EDR
# process-creation fields (Image, ParentImage, TargetFilename) that an SSH
# honeypot cannot emit. MITRE ATT&CK defines the behaviour; ART's atomics
# supply the command forms this pattern is written against.
logsource:
  product: cowrie
  category: command
detection:
  selection:
    command|re:
      - '(?:>>?|\btee\b(?:\s+-\w+)*)\s*\S*(?:\.bashrc|\.bash_profile|\.bash_login|\.bash_logout|\.profile|\.shrc|\.zshrc|\.zprofile|\.zshenv|\.kshrc|\.cshrc|\.tcshrc)\b'
      - '(?:>>?|\btee\b(?:\s+-\w+)*)\s*\S*/etc/(?:profile|bash\.bashrc|zsh/z\w+|csh\.cshrc|csh\.login)\b'
      - '(?:>>?|\btee\b(?:\s+-\w+)*)\s*\S*/etc/profile\.d/'
      - '\bsed\s+-i\b[^|;]*(?:\.bashrc|\.bash_profile|\.profile|\.zshrc|/etc/profile)\b'
  condition: selection
tags:
  - attack.privilege-escalation
  - attack.t1546.004
