id: ca9f4b2e-0b16-4fed-ae99-decc7c253465
title: 'Password Policy Discovery'
status: stable
description: >-
  The account password policy is read -- /etc/login.defs, the PAM stack,
  or `chage -l`. An attacker checks this before brute forcing or before
  setting a password that the policy would reject.
references:
  - https://attack.mitre.org/techniques/T1201
  - https://github.com/redcanaryco/atomic-red-team  # 5 Linux atomic(s)
author: HydraPoT
date: 2026-09-20
technique: T1201
technique_name: 'Password Policy Discovery'
tactic: 'Discovery'
priority: 50
confidence: high
# DERIVATION. SigmaHQ's imported Linux rules detect 0 of this technique's
# Atomic Red Team Linux atomics: their detection is written against EDR
# process-creation fields (Image, ParentImage, TargetFilename) that an SSH
# honeypot cannot emit. MITRE ATT&CK defines the behaviour; ART's atomics
# supply the command forms this pattern is written against.
logsource:
  product: cowrie
  category: command
detection:
  selection:
    command|re:
      - '\b(?:cat|less|more|head|tail|grep|egrep)\b[^|;]*/etc/login\.defs\b'
      - '\b(?:cat|less|more|head|tail|grep|egrep|ls)\b[^|;]*/etc/pam\.d/'
      - '\b(?:cat|less|more|head|tail|grep)\b[^|;]*/etc/security/pwquality\.conf\b'
      - '\bchage\s+-\w*l\b'
      - '\bpwpolicy\b'
  condition: selection
tags:
  - attack.discovery
  - attack.t1201
