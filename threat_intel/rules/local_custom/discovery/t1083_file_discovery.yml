id: d296a26e-fc4d-4e71-a016-f7de66b1d46f
title: 'File and Directory Discovery'
status: stable
description: >-
  The filesystem is enumerated. Lowest-priority discovery rule: `ls` is
  near-universal, so when a command also matches something sharper that
  tag wins. find -exec spawning a shell is a break-out (T1059.004) and is
  filtered out here.
references:
  - https://attack.mitre.org/techniques/T1083
  - https://github.com/redcanaryco/atomic-red-team  # 3 Linux atomic(s)
author: HydraPoT
date: 2026-09-20
technique: T1083
technique_name: 'File and Directory Discovery'
tactic: 'Discovery'
priority: 65
confidence: high
# DERIVATION. SigmaHQ's imported Linux rules detect 0 of this technique's
# Atomic Red Team Linux atomics: their detection is written against EDR
# process-creation fields (Image, ParentImage, TargetFilename) that an SSH
# honeypot cannot emit. MITRE ATT&CK defines the behaviour; ART's atomics
# supply the command forms this pattern is written against.
logsource:
  product: cowrie
  category: command
detection:
  selection:
    segment|re:
      - '^\s*(?:sudo\s+)?(?:ls|dir|vdir|find|locate|tree|du|stat|file|findmnt|showmount)\b'
      - '^\s*(?:\S*/)?busybox\s+ls\b'
      - '^\s*(?:sudo\s+)?mount\s*(?:-\w+\s*)*$'
      - '\bsmbclient\b[^|;]*\s-L\b'
  filter_shell_escape:
    command|re:
      - '\bfind\b[^|;]*-exec\w*\s+(?:\S*/)?(?:ba|z|k|da|a)?sh\b'
      - '\bfind\b[^|;]*-exec\w*\s+(?:\S*/)?(?:python3?|perl|ruby|awk|nc|ncat)\b'
  condition: selection and not filter_shell_escape
tags:
  - attack.discovery
  - attack.t1083
