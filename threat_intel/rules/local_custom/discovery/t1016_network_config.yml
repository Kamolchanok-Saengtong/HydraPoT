id: 71c05fd2-c2b6-464b-ab14-305262d91d64
title: 'System Network Configuration Discovery'
status: stable
description: >-
  Interface addresses, routes, ARP cache and DNS configuration are read --
  the attacker working out where they landed and what is reachable.
references:
  - https://attack.mitre.org/techniques/T1016
  - https://github.com/redcanaryco/atomic-red-team  # 1 Linux atomic(s)
author: HydraPoT
date: 2026-09-20
technique: T1016
technique_name: 'System Network Configuration Discovery'
tactic: 'Discovery'
priority: 50
confidence: high
# DERIVATION. SigmaHQ's imported Linux rules detect 0 of this technique's
# Atomic Red Team Linux atomics: their detection is written against EDR
# process-creation fields (Image, ParentImage, TargetFilename) that an SSH
# honeypot cannot emit. MITRE ATT&CK defines the behaviour; ART's atomics
# supply the command forms this pattern is written against.
logsource:
  product: cowrie
  category: command
detection:
  selection_tool:
    segment|re:
      - '(?:^|\||\b(?:then|else|elif|do)\s+)\s*(?:sudo\s+)?(?:ifconfig|iwconfig|arp|route|nmcli|resolvectl|systemd-resolve)\b'
      - '(?:^|\||\b(?:then|else|elif|do)\s+)\s*(?:sudo\s+)?ip\s+(?:-\w+\s+)*(?:a|addr|address|link|route|neigh|rule)\b'
      - '(?:^|\||\b(?:then|else|elif|do)\s+)\s*(?:sudo\s+)?netstat\s+-\w*a?n?t\b'
      - '^\s*(?:sudo\s+)?hostname\s+-[iI]\b'
  selection_file:
    command|re:
      - '\b(?:cat|less|more|head|tail)\b[^|;]*/etc/(?:resolv\.conf|hosts|network/interfaces|netplan|sysconfig/network)'
  condition: 1 of selection*
tags:
  - attack.discovery
  - attack.t1016
