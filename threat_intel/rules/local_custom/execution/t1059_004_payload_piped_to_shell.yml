id: d6a97c68-c2ce-4a9f-b749-14e229af4a6e
title: 'Command and Scripting Interpreter: Unix Shell'
status: stable
description: >-
  Remote or decoded content is fed straight into an interpreter without
  ever being written to disk -- the curl|sh pattern. Highest priority of
  the T1059.004 family: nothing legitimate needs to execute a stream it
  has not inspected.
references:
  - https://attack.mitre.org/techniques/T1059/004
  - https://github.com/redcanaryco/atomic-red-team  # 14 Linux atomic(s)
author: HydraPoT
date: 2026-09-20
technique: T1059.004
technique_name: 'Unix Shell'
tactic: 'Execution'
priority: 10
confidence: high
# DERIVATION. SigmaHQ's imported Linux rules detect 0 of this technique's
# Atomic Red Team Linux atomics: their detection is written against EDR
# process-creation fields (Image, ParentImage, TargetFilename) that an SSH
# honeypot cannot emit. MITRE ATT&CK defines the behaviour; ART's atomics
# supply the command forms this pattern is written against.
logsource:
  product: cowrie
  category: command
detection:
  selection_pipe:
    command|re:
      - '\|\s*(?:sudo\s+)?(?:\S*/)?(?:ba|z|k|da|a)?sh\b'
      - '\|\s*(?:\S*/)?(?:python3?|perl|ruby|php|node)\b'
  selection_fetch_run:
    command|re:
      - '\b(?:curl|wget|fetch)\b[^;]*&&\s*(?:sudo\s+)?(?:\./|(?:\S*/)?(?:ba)?sh\b)'
      - '\$\(\s*(?:curl|wget)\b[^)]*\)'
  condition: 1 of selection*
tags:
  - attack.execution
  - attack.t1059.004
