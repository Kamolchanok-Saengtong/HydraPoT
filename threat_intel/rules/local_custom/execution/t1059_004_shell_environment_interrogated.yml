id: e86bf2b8-7f59-4776-9989-da3374635371
title: 'Command and Scripting Interpreter: Unix Shell'
status: stable
description: >-
  Which shell am I in, and what else is available -- `echo $0`, `printenv
  SHELL`, `cat /etc/shells`, then `chsh -s` to change it. Lowest priority
  in the T1059.004 family: on its own this is orientation, not execution,
  so anything sharper on the same command wins the tag.
references:
  - https://attack.mitre.org/techniques/T1059/004
  - https://github.com/redcanaryco/atomic-red-team  # 5 Linux atomic(s)
author: HydraPoT
date: 2026-09-20
technique: T1059.004
technique_name: 'Unix Shell'
tactic: 'Execution'
priority: 85
confidence: medium
# DERIVATION. SigmaHQ's imported Linux rules detect 0 of this technique's
# Atomic Red Team Linux atomics: their detection is written against EDR
# process-creation fields (Image, ParentImage, TargetFilename) that an SSH
# honeypot cannot emit. MITRE ATT&CK defines the behaviour; ART's atomics
# supply the command forms this pattern is written against.
logsource:
  product: cowrie
  category: command
detection:
  selection_which_shell:
    command|re:
      - '\becho\s+\S{0,2}\$(?:0|SHELL)\b'
      - '\bprintenv\s+SHELL\b'
      - '\benv\b[^|;]*\|\s*grep\b[^|;]*SHELL'
      - '\bgrep\b[^|;]*\bSHELL\b'
  selection_available:
    command|re:
      - '\b(?:cat|less|more|head)\b[^|;]*/etc/shells\b'
  selection_change:
    command|re:
      - '\buname\s+-\w*[srm]'
      - '\bchsh\b[^|;]*\s-s\b'
      - '\busermod\b[^|;]*\s-s\s+\S*sh\b'
      - '\bpw\s+useradd\b[^|;]*\s-s\b'
      - '\buseradd\b[^|;]*\s-s\s+\S*sh\b'
  condition: 1 of selection*
tags:
  - attack.execution
  - attack.t1059.004
