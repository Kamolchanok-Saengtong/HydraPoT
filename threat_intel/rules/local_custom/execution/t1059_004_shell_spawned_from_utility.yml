id: 26ac6be2-594b-4f5f-baf8-b29a01f49656
title: 'Command and Scripting Interpreter: Unix Shell'
status: stable
description: >-
  A shell is obtained through a utility that was never meant to give one
  -- awk system(), perl exec, a pager's ! escape, find -exec sh. The
  classic GTFOBins restricted-shell break-out.
references:
  - https://attack.mitre.org/techniques/T1059/004
  - https://github.com/redcanaryco/atomic-red-team  # 14 Linux atomic(s)
author: HydraPoT
date: 2026-09-20
technique: T1059.004
technique_name: 'Unix Shell'
tactic: 'Execution'
priority: 15
confidence: high
# DERIVATION. SigmaHQ's imported Linux rules detect 0 of this technique's
# Atomic Red Team Linux atomics: their detection is written against EDR
# process-creation fields (Image, ParentImage, TargetFilename) that an SSH
# honeypot cannot emit. MITRE ATT&CK defines the behaviour; ART's atomics
# supply the command forms this pattern is written against.
logsource:
  product: cowrie
  category: command
detection:
  selection_awk:
    command|re:
      - '\b(?:g|m)?awk\b[^|;]*\bsystem\s*\('
      - '\b(?:g|m)?awk\b[^|;]*BEGIN\s*\{[^}]*\b(?:system|print\s*\|)'
  selection_interp:
    command|re:
      - '\bperl\b[^|;]*\bexec\s*[\(\x27"][^\x27"]*/(?:bin|usr)\S*sh'
      - '\bruby\b[^|;]*\bexec\s*[\(\x27"][^\x27"]*sh'
  selection_pager:
    command|re:
      - '\bvim?\b[^|;]*[:!]\s*!\s*(?:\S*/)?(?:ba)?sh\b'
      - '\b(?:less|more|man)\b[^|;]*!\s*(?:\S*/)?(?:ba)?sh\b'
      - '\bemacs\b[^|;]*--eval[^|;]*\b(?:term|shell|call-process)\b'
  selection_repl_escape:
    command|re:
      - '\bcpan\b'
      - '\bgdb\b[^|;]*(?:-ex\s+[\x27"]?!|\bshell\b)'
      - '\bftp\b[^|;]*\s!\s*(?:\S*/)?(?:ba)?sh\b'
      - '\b(?:ed|ex|nmap)\b[^|;]*\s!\s*(?:\S*/)?(?:ba)?sh\b'
  selection_find:
    command|re:
      - '\bfind\b[^|;]*-exec\w*\s+(?:\S*/)?(?:ba|z|k|da|a)?sh\b'
      - '\bfind\b[^|;]*-exec\w*\s+(?:\S*/)?(?:python3?|perl|ruby|awk|nc|ncat)\b'
  condition: 1 of selection*
tags:
  - attack.execution
  - attack.t1059.004
