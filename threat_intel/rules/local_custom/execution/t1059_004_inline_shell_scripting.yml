id: 85a051de-e619-471f-8d8b-8128ba8f0160
title: 'Command and Scripting Interpreter: Unix Shell'
status: stable
description: >-
  Shell control flow typed directly on the command line -- a for/while
  loop with do...done. Legitimate on an admin's terminal, so priority is
  low; it earns its place because Mirai's busybox probe loop takes this
  form.
references:
  - https://attack.mitre.org/techniques/T1059/004
  - https://github.com/redcanaryco/atomic-red-team  # 14 Linux atomic(s)
author: HydraPoT
date: 2026-09-20
technique: T1059.004
technique_name: 'Unix Shell'
tactic: 'Execution'
priority: 50
confidence: medium
# DERIVATION. SigmaHQ's imported Linux rules detect 0 of this technique's
# Atomic Red Team Linux atomics: their detection is written against EDR
# process-creation fields (Image, ParentImage, TargetFilename) that an SSH
# honeypot cannot emit. MITRE ATT&CK defines the behaviour; ART's atomics
# supply the command forms this pattern is written against.
logsource:
  product: cowrie
  category: command
detection:
  selection:
    command|re:
      - '\bfor\s+\w+\s+in\b[^;]*;\s*do\b'
      - '\bfor\s*\(\([^)]*\)\)\s*;?\s*do\b'
      - '\b(?:while|until)\b[^;]*;\s*do\b'
      - ';\s*done\b'
  condition: selection
tags:
  - attack.execution
  - attack.t1059.004
