id: 405a9e76-f9eb-48d9-8bcc-6a8f124c098e
title: 'Impair Defenses: Disable or Modify Tools'
status: stable
description: >-
  A logging daemon, EDR agent or kernel hardening control is stopped,
  masked or turned off. ART's atomics stop systemd-journald, auditd,
  rsyslog and apparmor via systemctl/service, and disable SELinux with
  setenforce 0.
references:
  - https://attack.mitre.org/techniques/T1685
  - https://github.com/redcanaryco/atomic-red-team  # 16 Linux atomic(s)
author: HydraPoT
date: 2026-09-20
technique: T1685
technique_name: 'Disable or Modify Tools'
tactic: 'Defense Impairment'
priority: 15
confidence: high
# DERIVATION. SigmaHQ's imported Linux rules detect 0 of this technique's
# Atomic Red Team Linux atomics: their detection is written against EDR
# process-creation fields (Image, ParentImage, TargetFilename) that an SSH
# honeypot cannot emit. MITRE ATT&CK defines the behaviour; ART's atomics
# supply the command forms this pattern is written against.
logsource:
  product: cowrie
  category: command
detection:
  selection_service:
    command|re:
      - '\b(?:systemctl|service|rc-service|invoke-rc\.d|initctl)\b[^|;]*\b(?:stop|disable|mask|kill)\b[^|;]*\b(?:apparmor|auditd|audispd|selinux|falcon|cbdaemon|carbonblack|falco|systemd-journald|journald|rsyslog|syslog-ng|syslogd|syslog|fail2ban|ossec|wazuh|clamav|clamd|snort|suricata|osquery|amazon-ssm-agent|mdatp|sentinelone|auditbeat|filebeat)'
      - '\b(?:service|rc-service|invoke-rc\.d)\b[^|;]*\b(?:apparmor|auditd|selinux|journald|rsyslog|syslog|fail2ban|ossec|wazuh|clamav|snort|suricata|osquery)\S*\s+(?:stop|disable|onestop|forcestop)\b'
      - '/etc/init\.d/\S*(?:auditd|rsyslog|syslog|apparmor|falcon|clamav|fail2ban|ossec|wazuh)\S*\s+(?:stop|disable)\b'
  selection_mac:
    command|re:
      - '\bsetenforce\s+0\b'
      - '\baa-(?:disable|complain|teardown)\b'
      - '\bauditctl\s+(?:-e\s*0\b|-D\b)'
      - '\bsemanage\s+permissive\b'
      - '\bchkconfig\b[^|;]*\b(?:auditd|rsyslog|syslog|apparmor|iptables)\S*\s+off\b'
  selection_config:
    command|re:
      - '(?:>>?|\btee\b|\bsed\s+-i)[^|;&]*/etc/(?:audit|audisp|security/|systemd/journald\.conf|r?syslog\.conf|syslog-ng/|selinux/|apparmor)'
  selection_kernel:
    command|re:
      - '\bsysctl\s+-w\s+kernel\.(?:randomize_va_space|dmesg_restrict|kptr_restrict|perf_event_paranoid)\s*=\s*0\b'
      - '>\s*/proc/sys/kernel/(?:randomize_va_space|dmesg_restrict|kptr_restrict|sysrq)\b'
      - '>\s*/proc/sys/vm/drop_caches\b'
      - '\bswapoff\b'
  # ART ties these to T1685 as well as to T1070.003/T1690. Tagged here so the
  # mapper agrees with the reference; the more specific rules still fire too.
  selection_history:
    command|re:
      - '\bhistory\s+-c\b'
      - '\bset\s+\+o\s+history\b'
      - '\bset\s+\+H\b'
  selection_edr_cli:
    command|re:
      - '\bmdatp\b[^|;]*\bconfig\b[^|;]*(?:real-time-protection|--value\s+disabled)'
      - '\bfalconctl\b[^|;]*(?:\s-d\b|\bunload\b)'
      - '\bsentinelctl\b[^|;]*(?:unload|disable)'
      - '\bwdavdaemon\b'
  condition: 1 of selection*
tags:
  - attack.defense-impairment
  - attack.t1685
