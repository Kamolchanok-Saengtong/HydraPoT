id: 59f39798-efc5-4dcd-adce-d79955ed8f50
title: 'Impair Defenses: Disable Command History Logging'
status: stable
description: >-
  History recording is switched off BEFORE the attacker works, so nothing
  is written in the first place. Distinct from T1070.003, which erases a
  record that already exists. ART's uncovered atomics include `export
  HISTCONTROL=ignoreboth` and `set +o history`.
references:
  - https://attack.mitre.org/techniques/T1690
  - https://github.com/redcanaryco/atomic-red-team  # 9 Linux atomic(s)
author: HydraPoT
date: 2026-09-20
technique: T1690
technique_name: 'Disable Command History Logging'
tactic: 'Defense Impairment'
priority: 15
confidence: high
# DERIVATION. SigmaHQ's imported Linux rules detect 0 of this technique's
# Atomic Red Team Linux atomics: their detection is written against EDR
# process-creation fields (Image, ParentImage, TargetFilename) that an SSH
# honeypot cannot emit. MITRE ATT&CK defines the behaviour; ART's atomics
# supply the command forms this pattern is written against.
logsource:
  product: cowrie
  category: command
detection:
  selection_vars:
    command|re:
      - '\b(?:export\s+)?(?:unset\s+)?HISTFILE\s*=\s*[\x27"]?(?:/dev/null|[\x27"]?\s*(?:;|$))'
      - '\bunset\s+(?:HISTFILE|HISTSIZE|HISTFILESIZE|HISTCONTROL|HISTIGNORE)\b'
      - '\b(?:export\s+)?(?:HISTSIZE|HISTFILESIZE)\s*=\s*[\x27"]?0\b'
      - '\b(?:export\s+)?HISTCONTROL\s*=\s*[\x27"]?\S*ignore(?:space|both|dups)\b'
      - '\b(?:export\s+)?HISTIGNORE\s*=\s*[\x27"]'
  selection_option:
    command|re:
      - '\bset\s+\+o\s+history\b'
      - '\bset\s+\+H\b'
      - '\bshopt\s+-u\s+hist\w*\b'
  selection_redirect:
    command|re:
      - '\bln\s+-\w*s\w*\s+/dev/null\s+\S*(?:\.bash_history|\.zsh_history|\.history)\b'
  selection_histfile:
    command|re:
      - '\$HISTFILE\b'
  condition: 1 of selection*
tags:
  - attack.defense-impairment
  - attack.t1690
