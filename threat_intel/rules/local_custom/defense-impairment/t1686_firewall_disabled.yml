id: e06a5747-5acd-4dbc-a580-f04d039ff0e5
title: 'Impair Defenses: Disable or Modify System Firewall'
status: stable
description: >-
  The host firewall is flushed, stopped or opened up. ART's atomics cover
  ufw, firewalld, iptables/nftables and BSD pf -- including `service pf
  disable`, which is why the BSD forms are matched too.
references:
  - https://attack.mitre.org/techniques/T1686
  - https://github.com/redcanaryco/atomic-red-team  # 12 Linux atomic(s)
author: HydraPoT
date: 2026-09-20
technique: T1686
technique_name: 'Disable or Modify System Firewall'
tactic: 'Defense Impairment'
priority: 15
confidence: high
# DERIVATION. SigmaHQ's imported Linux rules detect 0 of this technique's
# Atomic Red Team Linux atomics: their detection is written against EDR
# process-creation fields (Image, ParentImage, TargetFilename) that an SSH
# honeypot cannot emit. MITRE ATT&CK defines the behaviour; ART's atomics
# supply the command forms this pattern is written against.
logsource:
  product: cowrie
  category: command
detection:
  selection_ufw:
    command|re:
      - '\bufw\s+(?:--force\s+)?(?:disable|reset|allow|deny|reject|delete|insert|prepend|route|status|default)\b'
      - '\bufw\s+logging\b'
      - '(?:>>?|\btee\b|\bsed\s+-i)[^|;&]*/etc/(?:ufw/|default/ufw)'
      - '\b(?:cat|grep|less|head|tail)\b[^|;]*/etc/(?:ufw/|default/ufw)'
      - '\b(?:cat|grep|less|head|tail)\b[^|;]*/var/log/(?:ufw|firewalld|iptables)'
  selection_service:
    command|re:
      - '\b(?:systemctl|service|rc-service|invoke-rc\.d)\b[^|;]*\b(?:stop|disable|mask)\b[^|;]*\b(?:ufw|firewalld|ip6?tables|nftables|netfilter-persistent|ipfw|pf)\b'
      - '\bservice\s+pf\s+(?:stop|disable|onestop)\b'
  selection_tables:
    command|re:
      - '\bip6?tables(?:-\w+)?\b[^|;]*\s-(?:F|X|Z|D)\b'
      - '\bip6?tables\b[^|;]*\s-P\s+(?:INPUT|OUTPUT|FORWARD)\s+ACCEPT\b'
      - '\bnft\s+(?:-\S+\s+)*(?:flush|delete)\s+(?:ruleset|table|chain)\b'
      - '\bpfctl\b[^|;]*\s-(?:d|F)\b'
  selection_firewalld:
    command|re:
      - '\bfirewall-cmd\b[^|;]*--(?:remove-(?:service|port|rich-rule)|panic-off|set-default-zone=trusted)'
  condition: 1 of selection*
tags:
  - attack.defense-impairment
  - attack.t1686
