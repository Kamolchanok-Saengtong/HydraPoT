id: c4d5e6c2-4a8e-465f-beb5-8522a74fc761
title: 'Unsecured Credentials: Credentials In Files'
status: stable
description: >-
  A hunt for credential files on disk -- cloud provider credential stores
  (~/.aws/credentials, ~/.azure, ~/.config/gcloud), .netrc, .pgpass, or a
  grep for password-shaped strings across a tree. ART's atomics search for
  these by name; that search IS the technique.
references:
  - https://attack.mitre.org/techniques/T1552/001
  - https://github.com/redcanaryco/atomic-red-team  # 6 Linux atomic(s)
author: HydraPoT
date: 2026-09-20
technique: T1552.001
technique_name: 'Credentials In Files'
tactic: 'Credential Access'
priority: 15
confidence: high
# DERIVATION. SigmaHQ's imported Linux rules detect 0 of this technique's
# Atomic Red Team Linux atomics: their detection is written against EDR
# process-creation fields (Image, ParentImage, TargetFilename) that an SSH
# honeypot cannot emit. MITRE ATT&CK defines the behaviour; ART's atomics
# supply the command forms this pattern is written against.
logsource:
  product: cowrie
  category: command
detection:
  selection_cloud:
    command|re:
      - '\b(?:find|ls|cat|grep|locate)\b[^|;]*\.aws\b'
      - '\b(?:find|ls|cat|grep|locate)\b[^|;]*\.azure\b'
      - '\b(?:find|ls|cat|grep|locate)\b[^|;]*\.oci\b'
      - '\b(?:find|ls|cat|grep|locate)\b[^|;]*\.config/gcloud\b'
      - '\b(?:find|ls|cat|grep|locate)\b[^|;]*\.docker/config\.json\b'
      - '\b(?:find|ls|cat|grep|locate)\b[^|;]*\.kube/config\b'
  selection_dotfiles:
    command|re:
      - '\b(?:cat|less|more|head|grep|find)\b[^|;]*(?:\.netrc|\.pgpass|\.my\.cnf|\.git-credentials|\.npmrc)\b'
  selection_grep_hunt:
    command|re:
      - '\bgrep\b[^|;]*-\w*[riR]\w*\b[^|;]*(?:password|passwd|PASSWORD|api[_-]?key|secret|BEGIN [A-Z ]*PRIVATE KEY)'
      - '\bfind\b[^|;]*-name\s+[\x27"]?\*\.(?:pem|key|ppk|p12|pfx)[\x27"]?'
  condition: 1 of selection*
tags:
  - attack.credential-access
  - attack.t1552.001
