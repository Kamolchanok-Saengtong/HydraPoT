id: 23991fc6-359a-4750-b261-c46773ea6298
title: 'OS Credential Dumping: /etc/passwd and /etc/shadow'
status: stable
description: >-
  The local credential stores are read or copied. Writes are excluded by
  filter_write -- chpasswd, usermod and a redirect INTO those files are
  account manipulation (T1136/T1531), not credential dumping, and tagging
  them here would mix two different claims.
references:
  - https://attack.mitre.org/techniques/T1003/008
  - https://github.com/redcanaryco/atomic-red-team  # 5 Linux atomic(s)
author: HydraPoT
date: 2026-09-20
technique: T1003.008
technique_name: '/etc/passwd and /etc/shadow'
tactic: 'Credential Access'
priority: 15
confidence: high
# DERIVATION. SigmaHQ's imported Linux rules detect 0 of this technique's
# Atomic Red Team Linux atomics: their detection is written against EDR
# process-creation fields (Image, ParentImage, TargetFilename) that an SSH
# honeypot cannot emit. MITRE ATT&CK defines the behaviour; ART's atomics
# supply the command forms this pattern is written against.
logsource:
  product: cowrie
  category: command
detection:
  selection:
    command|re:
      - '\b(?:cat|less|more|head|tail|strings|cp|scp|grep|egrep|awk|sed|sort|uniq|unshadow)\b[^|;]*/etc/(?:shadow|passwd|master\.passwd|gshadow)\b'
      - '/etc/(?:shadow|master\.passwd|gshadow)\b'
  filter_write:
    command|re:
      - '\bsed\s+(?:-\w+\s+)*-\w*i\w*\b[^|;]*/etc/(?:shadow|passwd)\b'
      - '(?:>>?|\btee\b)\s*\S*/etc/(?:shadow|passwd)\b'
      - '\b(?:chpasswd|usermod|useradd|adduser)\b[^|;]*/etc/(?:shadow|passwd)\b'
  condition: selection and not filter_write
tags:
  - attack.credential-access
  - attack.t1003.008
