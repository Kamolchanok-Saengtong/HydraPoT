id: 638881b4-ff6b-4901-a24e-92eed7caf795
title: 'Ingress Tool Transfer'
status: stable
description: >-
  A payload is pulled onto the host from outside. This is the single most
  common observed behaviour in the capture (124 distinct commands): a
  Mirai-family loader fetching its architecture-specific binary over
  wget/curl/tftp/ftpget, usually several transports in a row so one
  succeeds.
references:
  - https://attack.mitre.org/techniques/T1105
  - https://github.com/redcanaryco/atomic-red-team  # 8 Linux atomic(s)
author: HydraPoT
date: 2026-09-20
technique: T1105
technique_name: 'Ingress Tool Transfer'
tactic: 'Command and Control'
priority: 30
confidence: high
# DERIVATION. SigmaHQ's imported Linux rules detect 0 of this technique's
# Atomic Red Team Linux atomics: their detection is written against EDR
# process-creation fields (Image, ParentImage, TargetFilename) that an SSH
# honeypot cannot emit. MITRE ATT&CK defines the behaviour; ART's atomics
# supply the command forms this pattern is written against.
logsource:
  product: cowrie
  category: command
detection:
  selection:
    segment|re:
      - '^\s*(?:sudo\s+)?(?:wget|curl|tftp|ftpget|ftp|lwp-download|aria2c)\b'
      - '^\s*(?:busybox\s+)?(?:wget|tftp|ftpget)\b'
      - '^\s*(?:sudo\s+)?(?:scp|rsync|sftp)\s+\S'
      - '\bnc\b[^;|]*<\s*\S'
      - '\bpython3?\b[^|;]*urllib\S*\.urlretrieve\b'
      - '\bwhois\s+(?:-\w+\s+\S+\s+)*-h\b'
  condition: selection
tags:
  - attack.command-and-control
  - attack.t1105
