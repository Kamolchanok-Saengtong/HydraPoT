
name: Dependencies

# Its own workflow, not a job in ci.yml, so it gets its own README badge —
# GitHub badges are per workflow file, never per job.

on:
  push:
  pull_request:

jobs:
  deptry:
    # compileall parses files but never resolves an import, so it can't see a
    # package that is imported and undeclared.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - run: pip install deptry

      # Needs no project dependencies installed — see package_module_name_map
      # in pyproject.toml
      - name: Check declared dependencies match the imports
        run: deptry .
