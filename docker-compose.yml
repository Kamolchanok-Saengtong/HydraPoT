services:
  cowrie:
    image: cowrie/cowrie
    ports:
      - "127.0.0.1:2222:2222"
    # Everything below is generated by plugins/cowrie_fs.py from config.yaml.
    # Rebuild after editing config:  python plugins/cowrie_fs.py
    #
    # Mounted at NEW paths, never on top of Cowrie's own directories: their
    # docs warn that mounting /cowrie/cowrie-git/etc hides the files already
    # there (userdb.txt, cowrie.cfg.dist) and breaks logins. Individual file
    # mounts hide nothing. Delete these two blocks to revert completely.
    env_file:
      - ./plugins/cowrie/cowrie.env
    volumes:
      - ./plugins/cowrie/fs.pickle:/myfs/fs.pickle:ro
      - ./plugins/cowrie/honeyfs/proc/version:/cowrie/cowrie-git/honeyfs/proc/version:ro
      - ./plugins/cowrie/honeyfs/etc/os-release:/cowrie/cowrie-git/honeyfs/etc/os-release:ro
      - ./plugins/cowrie/honeyfs/etc/issue:/cowrie/cowrie-git/honeyfs/etc/issue:ro
    environment:
      COWRIE_SHELL_FILESYSTEM: /myfs/fs.pickle
