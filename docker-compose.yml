services:
  cowrie:
    restart: unless-stopped
    image: cowrie/cowrie
    # COWRIE_PORT comes from .env, which hp writes from config.yaml's
    # agents.cowrie.port -- config.yaml is the single source. The default keeps
    # a bare `docker-compose up -d` working on a fresh clone with no .env.
    ports:
      - "127.0.0.1:${COWRIE_PORT:-2222}:2222"
    # Cowrie only emulates a shell, so it needs no privileges. Dropping them, and
    # capping what a runaway or compromised container can use, costs nothing.
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    pids_limit: 256
    mem_limit: 1g
    cpus: 1.0
    environment:
      # Cowrie's wget allows 5 requests per host per window by default, which
      # caps a `git clone` at about 5 files. Raised so a clone can land its
      # files; still a per-host cap, so the honeypot cannot be used to fetch
      # without limit. Lower it in .env to tighten.
      COWRIE_SHELL_WGET_RATE_LIMIT_REQUESTS: ${COWRIE_WGET_RATE_LIMIT_REQUESTS:-30}

  # ── HydraPoT SSH honeypot (the attacker-facing front end) ──────────────────
  hydrapot:
    restart: unless-stopped
    build:
      context: .
      dockerfile: docker/Dockerfile
      args:
        WITH_LOCAL_MODEL: ${WITH_LOCAL_MODEL:-0}
    image: hydrapot:latest
    environment:
      SERVICE: honeypot
      # Compose puts every service on one private network; the app reaches
      # Cowrie by its SERVICE NAME, not 127.0.0.1 (which, in a container, is the
      # app itself). config_loader applies this over config.yaml's native host.
      COWRIE_HOST: cowrie
      # Secrets + endpoint come from .env at runtime -- NEVER baked into the
      # image. Missing ones are simply absent (cloud arm then needs a real key).
      CLOUD_AGENT_API_KEY: ${CLOUD_AGENT_API_KEY:-}
      CLOUD_AGENT_BASE_URL: ${CLOUD_AGENT_BASE_URL:-}
    ports:
      - "${HONEYPOT_PORT:-2223}:2223"      # attacker-facing SSH
    volumes:
      - ./config.yaml:/app/config.yaml:ro  # single source of truth, mounted
      - ./data:/app/data                   # logs + SQLite persist on the host
      - hf-cache:/app/data/hf-cache        # model weights download once
    depends_on:
      - cowrie

  # ── Dashboard (same image, different role via SERVICE) ─────────────────────
  dashboard:
    restart: unless-stopped
    build:
      context: .
      dockerfile: docker/Dockerfile
      args:
        WITH_LOCAL_MODEL: ${WITH_LOCAL_MODEL:-0}
    image: hydrapot:latest
    environment:
      SERVICE: dashboard
    # No host port: the dashboard is reachable ONLY through the HTTPS proxy below.
    expose:
      - "8050"
    volumes:
      - ./config.yaml:/app/config.yaml:ro
      - ./data:/app/data                   # reads the same SQLite the honeypot writes
    depends_on:
      - hydrapot

  # ── HTTPS front door for the dashboard (the only way in) ───────────────────
  # Swap this service for your org's proxy; the contract is "terminate TLS,
  # forward to dashboard:8050". Cert settings come from .env (see proxy/README.md).
  caddy:
    restart: unless-stopped
    image: caddy:2
    ports:
      - "${HTTPS_PORT:-443}:443"
    environment:
      TLS_SITE: ${TLS_SITE:-localhost}
      TLS_CERT: ${TLS_CERT:-internal}
      TLS_KEY:  ${TLS_KEY:-}
    volumes:
      - ./proxy/Caddyfile:/etc/caddy/Caddyfile:ro
      - ./certs:/certs:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - dashboard

volumes:
  caddy-data:
  caddy-config:
  hf-cache:        # named volume: survives restarts, keeps model downloads

# Stock Cowrie, with its own built-in filesystem. Nothing here depends on a
# generated file, so bringing it up works on a fresh clone.
#
# To use your own filesystem and identity instead, run:
#     python plugins/cowrie_fs.py
#
# That writes docker-compose.override.yml, which Compose merges automatically
# (both v1 `docker-compose` and v2 `docker compose`).
# Delete the override to go back to stock.
#
# hydrapot + dashboard share ONE image (hydrapot:latest, built from
# docker/Dockerfile) and differ only by the SERVICE env var. The on-device LLM
# arm is OFF unless config.yaml enables it AND you run the GPU image
# (docker/Dockerfile.gpu); this CPU stack runs Cowrie + Cloud on any machine.
