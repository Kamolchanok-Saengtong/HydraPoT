  instance_name: default
  os: Ubuntu 22.04 LTS
  kernel: 5.15.0-91-generic
  kernel_build: '#101-Ubuntu SMP Tue Nov 14 13:30:08 UTC 2023'
  arch: x86_64
  host: 127.0.0.1
  port: 2223
agents:
  cowrie:
    enabled: true
    host: 127.0.0.1
    port: 2222
    username: root
    password: admin
  on_device:
    enabled: true
    model: unsloth/Qwen3.5-4B-GGUF
    quantization: 8bit
    gguf_file: Qwen3.5-4B-Q4_K_M.gguf
    temperature: 0.0
    max_tokens: 256
    do_sample: true
  cloud:
    enabled: true
    provider: openai
    model: openai/gpt-5.6-luna
    api_key_env: PSU_API_KEY
    temperature: 0.1
    max_tokens: 2048
    base_url: https://ai.psu.blue/v1
routing:
  fallback: cowrie
  fi_routing:
    0: cowrie
    1: cowrie
    2: on_device
    3: on_device
    4: cloud
static_commands:
- nmap
- ping
- traceroute
- tracepath
- top
- htop
- watch
- tail
- vim
- vi
- nano
- emacs
- less
- more
