# ═══════════════════════════════════════════════════════════════════════════════
# HydraPoT Configuration
# ═══════════════════════════════════════════════════════════════════════════════
# Generated by `hp --init`. Edit directly or re-run `hp --init` to reconfigure.

honeypot:
  hostname: dgx-h100-02
  instance_name: default
  # A returning attacker (same source address) finds the files, packages, history and
  # logins they left, for this many days. Never shared between addresses.
  remember_attackers: true
  remember_days: 30
  # The OS name comes from the stock image (plugins/snapshot). Kernel and arch are
  # declared here: a container shares the host's kernel, so reading them from docker
  # would show the machine running the honeypot.
  # Ubuntu 20.04's own kernel (focal 5.4.0-136), a real uname pair from a public log:
  # openbenchmarking.org/system/2301070-NE-INTELCORE38/Intel%20Core%20i3-3220/dmesg
  kernel: 5.4.0-136-generic
  kernel_build: '#153-Ubuntu SMP Thu Nov 24 15:56:58 UTC 2022'
  arch: x86_64
  ssh_version: OpenSSH_8.2p1 Ubuntu-4ubuntu0.13
  host: 0.0.0.0
  port: 2223
agents:
  cowrie:
    enabled: true
    host: 127.0.0.1
    port: 2222
    username: root
    password: admin
  on_device:
    enabled: true
    model: unsloth/Qwen3.5-9B-GGUF
    quantization: 8bit
    gguf_file: Qwen3.5-9B-Q5_K_M.gguf
    temperature: 0.0
    max_tokens: 256
    do_sample: true
  cloud:
    enabled: true
    provider: openai
    model: deepseek/deepseek-v4.1-flash
    temperature: 0.0
    max_tokens: 2048
    base_url: https://ai.psu.blue/v1
# `git clone` of a public repo: the real file list is read from the host's API
# and Cowrie fetches each file, so ls/cat show real content instead of an
# invented repo. Only hosts listed here are ever contacted. Cowrie's own wget
# rate limit (5 requests per host per minute by default) caps how many files
# land; raise [shell] wget_rate_limit_requests in Cowrie's config to fetch more.
git_clone:
  enabled: true
  max_files: 16
  max_file_bytes: 262144
  max_seconds: 60
  max_dirs: 200
  file_timeout: 1.0
  file_attempts: 6
  token_env: GITHUB_TOKEN
  hosts:
    github.com:
      tree: https://api.github.com/repos/{owner}/{repo}/git/trees/HEAD?recursive=1
      raw: https://raw.githubusercontent.com/{owner}/{repo}/HEAD/{path}

routing:
  # smart_router: the Honey Router trained with `hp --router` picks the agent (default).
  # user_control: you pick the agent per FI score (fi_routing below).
  mode: smart_router
  fallback: cowrie
  fi_routing:
    0: cowrie
    1: on_device
    2: on_device
    3: cloud
    4: cloud
# ── HydraSentinel (the dashboard YOU look at) ─────────────────────────────
dashboard:
  https_port: 8443
  # Your organisation's certificate (absolute paths, both or neither). Empty =
  # Caddy's own local CA; trust its root once per browser (see proxy/README.md).
  tls_cert: ''
  tls_key: ''
  tls_names: []
  # Hide private/loopback source IPs as experiment traffic (default). Set true
  # on a LAN or lab sensor, where private addresses are the real attackers.
  show_private_sources: false
  auth:
    # operator accounts AND their sessions live in this one SQLite file
    session_db: data/users.db
    session_lifetime_minutes: 480
    session_idle_minutes: 60
    max_attempts: 5
    lockout_minutes: 15
    min_password_length: 12
    scrypt_n: 16384
    scrypt_r: 8
    scrypt_p: 1
    open_paths:
    - ^/_hp/(?:login|logout)$
    - ^/assets/
    - ^/_favicon\.ico$
    - ^/api(?:/|$)
    - ^/(?:docs|redoc|openapi\.json)$

logging:
  session_dir: data/logs/sessions
  impactful_dir: data/logs/impactful
  auth_log: data/logs/auth_log.json
  fi_threshold: 2
  retention_days: 0
  retention_max_rows: 0
  retention_protect_instances: []
  retention_vacuum: true
  retention_on_start: false
system_state:
  # Packages this host has BEYOND the stock image (the stock ones are read from
  # plugins/ubuntu_packages.txt, so wget, curl, sudo... are already there).
  # What makes this host a server rather than the bare image: its daemons. Processes,
  # /tmp private dirs and the accounts above belong to these packages.
  extra_packages: [openssh-server, systemd, systemd-sysv, udev, dbus, rsyslog, nvidia-utils-535, cuda-toolkit-12-2]
  # What this host ships is read from the real image (plugins/ubuntu_commands.py);
  # only the difference from a stock install is written here.
  stock_image: hp-real:20.04
  stock_commands: plugins/ubuntu_commands.txt
  stock_packages: plugins/ubuntu_packages.txt
  extra_tools:
  - busybox, g++, gcc, gdb, hostnamectl, htop, journalctl, less, ltrace, lscpu, make, nmap, nvcc, nvidia-smi, ping, strace, systemctl, tracepath, traceroute
  missing_tools: []             # stock commands this host does NOT have
  # The image supplies its own accounts and groups (plugins/snapshot). These are the
  # ones the operator adds on top: the server daemons' accounts, and the people.
  users:
    systemd-network: {uid: 100, gid: 102, home: /run/systemd, shell: /usr/sbin/nologin, gecos: 'systemd Network Management,,,'}
    systemd-resolve: {uid: 101, gid: 103, home: /run/systemd, shell: /usr/sbin/nologin, gecos: 'systemd Resolver,,,'}
    systemd-timesync: {uid: 102, gid: 104, home: /run/systemd, shell: /usr/sbin/nologin, gecos: 'systemd Time Synchronization,,,'}
    messagebus: {uid: 103, gid: 106, home: /nonexistent, shell: /usr/sbin/nologin, gecos: ''}
    syslog: {uid: 104, gid: 110, home: /home/syslog, shell: /usr/sbin/nologin, gecos: '', groups: [adm, tty]}
    sshd: {uid: 111, gid: 65534, home: /run/sshd, shell: /usr/sbin/nologin, gecos: ''}
    mlops: {uid: 1001, gid: 1001, home: /home/mlops, shell: /bin/bash, gecos: 'ML Ops,,,', groups: [adm, cdrom, sudo, dip, plugdev]}
  groups:
    systemd-journal: {gid: 101}
    systemd-network: {gid: 102}
    systemd-resolve: {gid: 103}
    systemd-timesync: {gid: 104}
    messagebus: {gid: 106}
    syslog: {gid: 110}
    mlops: {gid: 1001}
  # When the accounts were set up (shadow's last-changed day). After the OS release.
  shadow_changed: '2024-06-12'
  shadow:
    root: $6$4aOmWdpJ$/kyPOik9rR0kSLyABIYNXgg/UqlWX3c1eIaovOLWphShTGXmuUAMq6iu9DrcQqlVUw3Pirizns4u27w3Ugvb6.
  versions:
    nmap: Nmap version 7.80 ( https://nmap.org )
    python3: Python 3.10.13
    python: Python 3.10.13
    git: git version 2.50.1
    vim: VIM - Vi IMproved 8.1 (2018 May 18, compiled Apr 02 2025 16:39:51)
    gcc: gcc (Ubuntu 9.4.0-1ubuntu1~20.04.2) 9.4.0
    ld: GNU ld (GNU Binutils for Ubuntu) 2.34
    g++: g++ (Ubuntu 9.4.0-1ubuntu1~20.04.2) 9.4.0
    curl: curl 7.68.0 (x86_64-pc-linux-gnu)
    wget: GNU Wget 1.20.3 built on linux-gnu.
    perl: This is perl 5, version 30, subversion 0 (v5.30.0)
    ruby: ruby 2.7.0p0 (2019-12-25 revision 647ee6f091) [x86_64-linux-gnu]
    node: v20.20.2
    make: GNU Make 4.2.1
    htop: htop 2.2.0 - (C) 2004-2019 Hisham Muhammad
