# ═══════════════════════════════════════════════════════════════════════════════
# HydraPoT Configuration
# ═══════════════════════════════════════════════════════════════════════════════
# Generated by `hp init`. Edit directly or re-run `hp init` to reconfigure.

honeypot:
  hostname: psu
  instance_name: default
  os: Ubuntu 22.04 LTS
  host: 0.0.0.0
  port: 2223

  # ── Concurrency bounds ────────────────────────────────────────────────
  # Calls into the local model are serialised (concurrent access aborts the
  # process), so sessions queue behind each other. Unbounded, a flood makes
  # the honeypot answer nobody — down, but silently, with no crash to alert
  # on. These two put a ceiling on that.
  max_sessions: 50          # concurrent attackers; extra are refused at TCP
                            # accept, which reads as a busy server. 0 = no cap
  model_wait_timeout: 20.0  # seconds a command waits for the model before
                            # giving up so it cannot stall the queue. 0 = wait
agents:
  cowrie:
    enabled: true
    host: 127.0.0.1
    port: 2222
    username: root
    password: admin
  on_device:
    enabled: true
    model: unsloth/Qwen3.5-9B-GGUF
    quantization: 8bit
    gguf_file: Qwen3.5-9B-Q5_K_M.gguf
    temperature: 0.0
    max_tokens: 256
    do_sample: true
  cloud:
    enabled: false
    provider: openai
    model: openai/gpt-5.6-luna
    api_key_env: PSU_API_KEY
    temperature: 0.1
    max_tokens: 2048
    base_url: https://ai.psu.blue/v1
routing:
  fallback: cowrie
  fi_routing:
    0: cowrie
    1: cowrie
    2: on_device
    3: on_device
    4: on_device
static_commands:
- nmap
- ping
- traceroute
- tracepath
- top
- htop
- watch
- tail
- vim
- vi
- nano
- emacs
- less
- more
logging:
  session_dir: data/logs/sessions
  impactful_dir: data/logs/impactful
  auth_log: data/logs/auth_log.json
  fi_threshold: 2

  # ── Retention ─────────────────────────────────────────────────────────
  # OFF by default (0 = keep everything). A honeypot on port 22 takes
  # thousands of hits a day and nothing prunes the database, so on a real
  # deployment it grows until the disk fills and the sensor stops recording
  # silently — the worst way for a sensor to fail.
  #
  # READ BEFORE ENABLING. This database holds live capture, the CyberLab
  # corpus (2019 timestamps) and the NSC experiment runs in the SAME tables.
  # `retention_days: 90` would delete CyberLab first — it is the oldest data
  # on the box and the only real attacker corpus. List anything
  # irreplaceable under retention_protect_instances before switching this on.
  #
  # Always dry-run first:
  #     python tools/prune_logs.py --days 90
  # and only then:
  #     python tools/prune_logs.py --days 90 --apply
  retention_days: 0                 # delete rows older than N days
  retention_max_rows: 0             # per table, keep only the N newest rows
  retention_protect_instances: []   # never delete these, e.g. ["CyberLab"]
  retention_vacuum: true            # reclaim disk after a prune
  retention_on_start: false         # prune once when the honeypot starts
system_state:
  pre_installed:
  - coreutils
  - bash
  - ssh
  - apt
  - apt-get
  - dpkg
  - grep
  - sed
  - awk
  - tar
  - gzip
  - net-tools
  - procps
  - util-linux
  - cron
  - sudo
  - passwd
  - wget
  - curl
  base_tools:
  - ls, cat, cp, mv, rm, mkdir, rmdir, touch, echo, pwd, head, tail, sort, uniq
  - wc, cut, tr, tee, dd, df, du, chmod, chown, chgrp, ln, basename, dirname
  - readlink, stat, truncate, nproc, id, whoami, who, users, groups, env, printenv
  - date, sleep, seq, yes, test, expr, base64, md5sum, sha1sum, sha256sum, sha512sum
  - cksum, comm, fold, nl, od, paste, split, tac, mktemp, realpath, timeout, install
  - mkfifo, nice, nohup, printf, tty, uname, vdir, dir, arch, logname, shred, sync
  - mount, umount, fdisk, lsblk, blkid, dmesg, more, kill, mountpoint, hexdump
  - getopt, flock, renice, taskset, lscpu, lsmem, findmnt, rev, column, whereis
  - cal, last, su, login, fsck, mkswap, swapon, swapoff, uuidgen, namei, ionice
  - ps, top, free, pkill, pgrep, pmap, pwdx, sysctl, tload, uptime, vmstat, w, watch
  - ifconfig, netstat, route, arp, ip, ss, bridge, tc, nstat, ping, arping, tracepath
  - grep, egrep, fgrep, sed, awk, gawk, tar, gzip, gunzip, zcat, bzip2, bunzip2
  - xz, unxz, find, xargs, diff, cmp, file, less, nano, vi, hostname, which, logger
  - passwd, useradd, userdel, usermod, groupadd, gpasswd, chage, crontab, adduser
  - apt, apt-get, apt-cache, dpkg, dpkg-query, update-alternatives
  - systemctl, journalctl, loginctl, timedatectl, hostnamectl, sudo, sudoedit, service
  - bash, sh, ssh, scp, sftp, ssh-keygen, perl, python3, gpg, curl, wget, openssl
  - dig, nslookup, host, xxd, at, finger, ltrace, strace,busybox
  - iostat, pcre2-config, hciconfig, pidstat, tempfile, ibus, networkctl, getconf
  - lspci, lsusb, hashcat, getent, gsettings, listres, traceroute, lnstat, getfacl
  - getcap, kmod, linux-version, lshw, lsipc, p11-kit, pactl, routel, rpcinfo
  - lastlog, time, b2sum, cupsctl, gpgconf, iwconfig, laptop-detect
  # ── Persona: what the fake machine IS ─────────────────────────────────
  # Edit these to change what an attacker believes they landed on. All of it
  # used to be hardcoded in main.py. Anything omitted falls back to the
  # defaults in config_loader.py, so you may delete keys you do not care about.

  # Fake /etc/passwd. `home` is also where `cd ~` and bare `cd` land for that
  # account. An account the attacker logs in as that is NOT listed here is
  # registered automatically with /home/<user>.
  # NOTE: Cowrie ships a demo user called `phil` — do not add it back, it is a
  # fingerprint that identifies the box as a honeypot.
  users:
    root:     {uid: 0,     gid: 0,     home: /root,         shell: /bin/bash}
    daemon:   {uid: 1,     gid: 1,     home: /usr/sbin,     shell: /bin/sh}
    bin:      {uid: 2,     gid: 2,     home: /bin,          shell: /bin/sh}
    www-data: {uid: 33,    gid: 33,    home: /var/www,      shell: /bin/sh}
    nobody:   {uid: 65534, gid: 65534, home: /nonexistent,  shell: /bin/sh}
    sshd:     {uid: 101,   gid: 65534, home: /var/run/sshd, shell: /usr/sbin/nologin}

  # Fake /etc/shadow — printed verbatim by `cat /etc/shadow`.
  shadow:
    root: "$6$4aOmWdpJ$/kyPOik9rR0kSLyABIYNXgg/UqlWX3c1eIaovOLWphShTGXmuUAMq6iu9DrcQqlVUw3Pirizns4u27w3Ugvb6."

  # `<tool> --version` output. Change these together with `os:` above — a box
  # claiming Ubuntu 22.04 while reporting CentOS tool versions is a giveaway.
  versions:
    nmap:    "Nmap version 7.80 ( https://nmap.org )"
    python3: "Python 3.10.12"
    python:  "Python 3.10.12"
    git:     "git version 2.34.1"
    vim:     "VIM - Vi IMproved 8.2 (2019 Dec 12)"
    gcc:     "gcc (Ubuntu 11.4.0-1ubuntu1~22.04) 11.4.0"
    g++:     "g++ (Ubuntu 11.4.0-1ubuntu1~22.04) 11.4.0"
    curl:    "curl 7.81.0 (x86_64-pc-linux-gnu)"
    wget:    "GNU Wget 1.21.2 built on linux-gnu."
    perl:    "This is perl 5, version 34, subversion 0 (v5.34.0)"
    ruby:    "ruby 3.0.2p107 (2021-07-07 revision 0db68f0233)"
    php:     "PHP 8.1.2-1ubuntu2.14 (cli)"
    node:    "v18.19.0"
    make:    "GNU Make 4.3"
    docker:  "Docker version 24.0.7, build afdd53b"
    nginx:   "nginx version: nginx/1.18.0 (Ubuntu)"
    htop:    "htop 3.2.1"
    tmux:    "tmux 3.2a"
    screen:  "Screen version 4.09.00 (GNU) 01-Sep-21"
    nano:    "GNU nano, version 6.2"
    emacs:   "GNU Emacs 27.1"
    mysql:   "mysql  Ver 8.0.36-0ubuntu0.22.04.1 for Linux on x86_64"

  # Directories that exist even with no file tracked under them, so `cd /opt`
  # succeeds. Every user's `home` above is added to this automatically.
  known_dirs:
    - /
    - /root
    - /home
    - /tmp
    - /var
    - /etc
    - /usr
    - /bin
    - /sbin
    - /proc
    - /sys
    - /dev
    - /opt
    - /srv
    - /mnt
    - /media
    - /run
    - /lib
    - /lib64
    - /boot
    - /var/tmp
    - /var/log
    - /var/run
    - /usr/bin
    - /usr/sbin
    - /usr/local

  # `apt install <pkg>` -> the command it provides. Package names are
  # distro-specific; the install/resolution logic itself stays in main.py.
  tool_packages:
    nmap: nmap
    masscan: masscan
    ncat: nmap
    netcat: netcat-openbsd
    nc: netcat-openbsd
    tcpdump: tcpdump
    socat: socat
    whois: whois
    python: python3
    python3: python3
    python2: python2
    perl: perl
    ruby: ruby
    php: php
    node: nodejs
    lua: lua5.3
    gcc: gcc
    g++: g++
    make: make
    gdb: gdb
    git: git
    strace: strace
    nginx: nginx
    apache2: apache2
    mysql: mysql-server
    mysqldump: mysql-client
    redis-cli: redis-tools
    docker: docker.io
    vim: vim
    nano: nano
    emacs: emacs
    wget: wget
    curl: curl
    htop: htop
    screen: screen
    tmux: tmux
    zip: zip
    unzip: unzip
    7z: p7zip-full
    jq: jq
    tree: tree

  starting_files:
    /var/log:
      perms: drwxr-xr-x
      size: 4.0K
    /root/.bashrc:
      perms: -rw-r--r--
      size: 3.7K
    /root/.profile:
      perms: -rw-r--r--
      size: 161B
    /root/.bash_history:
      perms: -rw-------
      size: 0B
power_tariff:
  tiers:
  - max_units: 15
    rate_thb_per_unit: 2.3488
  - max_units: 150
    rate_thb_per_unit: 3.2484
  - max_units: 400
    rate_thb_per_unit: 4.2218
  - max_units: null
    rate_thb_per_unit: 4.4217
  ft_surcharge_thb_per_unit: 0.1623
  vat_rate: 0.07
