    cowrie_host: 127.0.0.1
    cowrie_port: 2242
    session_dir: data/logs/sessions_internal
    impactful_dir: data/logs/impactful_internal
    auth_log: data/logs/auth_log_internal.json
power_tariff:
  tiers:
  - max_units: 15
    rate_thb_per_unit: 2.3488
  - max_units: 150
    rate_thb_per_unit: 3.2484
  - max_units: 400
    rate_thb_per_unit: 4.2218
  - max_units: null
    rate_thb_per_unit: 4.4217
  ft_surcharge_thb_per_unit: 0.1623
  vat_rate: 0.07
