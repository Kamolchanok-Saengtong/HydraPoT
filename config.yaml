# ═══════════════════════════════════════════════════════════════════════════════
# HydraPoT Configuration
# ═══════════════════════════════════════════════════════════════════════════════
# Generated by `hp init`. Edit directly or re-run `hp init` to reconfigure.

honeypot:
  hostname: psu
  instance_name: default
  os: Ubuntu 22.04 LTS
  # What `uname` reports. MUST match `os` above — an attacker runs `uname -a`
  # within seconds, and a kernel that disagrees with the login banner is the
  # cheapest possible tell. (Before this existed, `uname` was answered by
  # Cowrie and claimed Debian 7 from 2013.)
  kernel: 5.15.0-91-generic
  kernel_build: '#101-Ubuntu SMP Tue Nov 14 13:30:08 UTC 2023'
  arch: x86_64
  host: 127.0.0.1
  port: 2223
agents:
  cowrie:
    enabled: true
    host: 127.0.0.1
    port: 2222
    username: root
    password: admin
  on_device:
    enabled: true
    model: unsloth/Qwen3.5-4B-GGUF
    quantization: 8bit
    gguf_file: Qwen3.5-4B-Q4_K_M.gguf
    temperature: 0.0
    max_tokens: 256
    do_sample: true
  cloud:
    enabled: false
    provider: openai
    model: openai/gpt-5.6-luna
    api_key_env: PSU_API_KEY
    temperature: 0.1
    max_tokens: 2048
    base_url: https://ai.psu.blue/v1
routing:
  fallback: cowrie
  fi_routing:
    0: cowrie
    1: cowrie
    2: on_device
    3: on_device
    4: on_device
static_commands:
- nmap
- ping
- traceroute
- tracepath
- top
- htop
- watch
- tail
- vim
- vi
- nano
- emacs
- less
- more
logging:
  session_dir: data/logs/sessions
  impactful_dir: data/logs/impactful
  auth_log: data/logs/auth_log.json
  fi_threshold: 2
  retention_days: 0
  retention_max_rows: 0
  retention_protect_instances: []
  retention_vacuum: true
  retention_on_start: false
# Event Aggregator (threat_intel/aggregator.py) — summarizes collected events
# by session or by (src_ip, time window). "High-risk" reuses logging.fi_threshold
# above rather than a separate number. Categories below are keyed to REAL MITRE
# ATT&CK tactics/technique IDs (see threat_intel/mitre_catalog.json) already
# tagged per-command by mitre_mapper.py -- adding/renaming a category here
# never requires touching aggregator.py's code.
aggregation:
  window_minutes: 5
  # A session counts as ACTIVE in an overview window if its last command falls
  # within this many minutes of the window end. Sessions carry no explicit end
  # marker (an attacker just stops typing), so "active" has to be a recency
  # rule -- and the right value is deployment-specific, hence config not code.
  session_inactivity_minutes: 15
  # Activity-over-time granularity. Bucket size is DERIVED from the selected
  # window so it lands near this many buckets -- a 15m window and a 7d window
  # both stay readable without either being hardcoded to a fixed interval.
  timeline_target_buckets: 48
  categories:
    privilege_escalation:
      tactics: [Privilege Escalation]
    download:
      technique_ids: [T1105]              # Ingress Tool Transfer
    file_operations:
      technique_ids: [T1083, T1070.004, T1005]   # Discovery / Deletion / Collection
system_state:
  pre_installed:
  - coreutils
  - bash
  - ssh
  - apt
  - apt-get
  - dpkg
  - grep
  - sed
  - awk
  - tar
  - gzip
  - net-tools
  - procps
  - util-linux
  - cron
  - sudo
  - passwd
  - wget
  - curl
  base_tools:
  - ls, cat, cp, mv, rm, mkdir, rmdir, touch, echo, pwd, head, tail, sort, uniq
  - wc, cut, tr, tee, dd, df, du, chmod, chown, chgrp, ln, basename, dirname
  - readlink, stat, truncate, nproc, id, whoami, who, users, groups, env, printenv
  - date, sleep, seq, yes, test, expr, base64, md5sum, sha1sum, sha256sum, sha512sum
  - cksum, comm, fold, nl, od, paste, split, tac, mktemp, realpath, timeout, install
  - mkfifo, nice, nohup, printf, tty, uname, vdir, dir, arch, logname, shred, sync
  - mount, umount, fdisk, lsblk, blkid, dmesg, more, kill, mountpoint, hexdump
  - getopt, flock, renice, taskset, lscpu, lsmem, findmnt, rev, column, whereis
  - cal, last, su, login, fsck, mkswap, swapon, swapoff, uuidgen, namei, ionice
  - ps, top, free, pkill, pgrep, pmap, pwdx, sysctl, tload, uptime, vmstat, w, watch
  - ifconfig, netstat, route, arp, ip, ss, bridge, tc, nstat, ping, arping, tracepath
  - grep, egrep, fgrep, sed, awk, gawk, tar, gzip, gunzip, zcat, bzip2, bunzip2
  - xz, unxz, find, xargs, diff, cmp, file, less, nano, vi, hostname, which, logger
  - passwd, useradd, userdel, usermod, groupadd, gpasswd, chage, crontab, adduser
  - apt, apt-get, apt-cache, dpkg, dpkg-query, update-alternatives
  - systemctl, journalctl, loginctl, timedatectl, hostnamectl, sudo, sudoedit, service
  - bash, sh, ssh, scp, sftp, ssh-keygen, perl, python3, gpg, curl, wget, openssl
  - dig, nslookup, host, xxd, at, finger, ltrace, strace,busybox
  - iostat, pcre2-config, hciconfig, pidstat, tempfile, ibus, networkctl, getconf
  - lspci, lsusb, hashcat, getent, gsettings, listres, traceroute, lnstat, getfacl
  - getcap, kmod, linux-version, lshw, lsipc, p11-kit, pactl, routel, rpcinfo
  - lastlog, time, b2sum, cupsctl, gpgconf, iwconfig, laptop-detect
  users:
    root:
      uid: 0
      gid: 0
      home: /root
      shell: /bin/bash
    # Faculty admin account. Must exist HERE as well as under `filesystem:` —
    # this is what puts it in /etc/passwd and tells the LLM the account is
    # real. Declaring only the home directory left an attacker looking at a
    # /home/cocadmin that /etc/passwd said nothing about.
    cocadmin:
      uid: 1001
      gid: 1001
      home: /home/cocadmin
      shell: /bin/bash
      gecos: COC Admin
    daemon:
      uid: 1
      gid: 1
      home: /usr/sbin
      shell: /bin/sh
    bin:
      uid: 2
      gid: 2
      home: /bin
      shell: /bin/sh
    www-data:
      uid: 33
      gid: 33
      home: /var/www
      shell: /bin/sh
    nobody:
      uid: 65534
      gid: 65534
      home: /nonexistent
      shell: /bin/sh
    sshd:
      uid: 101
      gid: 65534
      home: /var/run/sshd
      shell: /usr/sbin/nologin
  shadow:
