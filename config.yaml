  - /boot
  - /var/tmp
  - /var/log
  - /var/run
  - /usr/bin
  - /usr/sbin
  - /usr/local
  tool_packages:
    nmap: nmap
    masscan: masscan
    ncat: nmap
    netcat: netcat-openbsd
    nc: netcat-openbsd
    tcpdump: tcpdump
    socat: socat
    whois: whois
    python: python3
    python3: python3
    python2: python2
    perl: perl
    ruby: ruby
    php: php
    node: nodejs
    lua: lua5.3
    gcc: gcc
    g++: g++
    make: make
    gdb: gdb
    git: git
    strace: strace
    nginx: nginx
    apache2: apache2
    mysql: mysql-server
    mysqldump: mysql-client
    redis-cli: redis-tools
    docker: docker.io
    vim: vim
    nano: nano
    emacs: emacs
    wget: wget
    curl: curl
    htop: htop
    screen: screen
    tmux: tmux
    zip: zip
    unzip: unzip
    7z: p7zip-full
    jq: jq
    tree: tree
  starting_files:
