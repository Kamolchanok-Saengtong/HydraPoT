# ═══════════════════════════════════════════════════════════════════════════════
# HydraPoT Configuration
# ═══════════════════════════════════════════════════════════════════════════════
# Generated by `hp --init`. Edit directly or re-run `hp --init` to reconfigure.

honeypot:
  hostname: psu
  instance_name: default
  # Declared to match the development host, measured on it, so ground truth
  # collected in Docker can be checked by hand in a terminal on that same
  # host. The version is not cosmetic: the ground-truth image is built FROM
  # ubuntu:<this>, and 20.04 ships bash 5.0 while 22.04 ships 5.1, which
  # report command-not-found differently ("bash: php: ..." vs
  # "bash: line 1: php: ..."). Declaring 22.04 here while checking against a
  # 20.04 host made every diagnostic in the dataset look wrong.
  os: Ubuntu 20.04.6 LTS
  kernel: 5.15.0-139-generic
  kernel_build: '#149~20.04.1-Ubuntu SMP Wed Apr 16 08:29:56 UTC 2025'
  arch: x86_64
  # The SSH banner. Keep in step with `os` above -- 8.2p1 Ubuntu-4ubuntu0.13
  # is this host's (`ssh -V`). Left unset, asyncssh advertises
  # "AsyncSSH_2.22.0", which nmap reports as `AsyncSSH sshd` and gives the
  # honeypot away at the handshake.
  ssh_version: OpenSSH_8.2p1 Ubuntu-4ubuntu0.13
  host: 0.0.0.0
  port: 2223
agents:
  cowrie:
    enabled: true
    host: 127.0.0.1
    port: 2222
    username: root
    password: admin
  on_device:
    enabled: true
    model: unsloth/Qwen3.5-9B-GGUF
    quantization: 8bit
    gguf_file: Qwen3.5-9B-Q5_K_M.gguf
    temperature: 0.0
    max_tokens: 256
    do_sample: true
  cloud:
    enabled: true
    provider: openai
    model: deepseek/deepseek-v4.1-flash
    temperature: 0.0
    max_tokens: 2048
    base_url: https://ai.psu.blue/v1
routing:
  fallback: cowrie
  fi_routing:
    0: cowrie
    1: on_device
    2: on_device
    3: cloud
    4: cloud
static_commands:
- nmap
- ping
- traceroute
- tracepath
- top
- htop
- watch
- tail
- vim
- vi
- nano
- emacs
- less
- more
logging:
  session_dir: data/logs/sessions
  impactful_dir: data/logs/impactful
  auth_log: data/logs/auth_log.json
  fi_threshold: 2
  retention_days: 0
  retention_max_rows: 0
  retention_protect_instances: []
  retention_vacuum: true
  retention_on_start: false
system_state:
  pre_installed:
  - coreutils
  - bash
  - ssh
  - apt
  - apt-get
  - dpkg
  - grep
  - sed
  - awk
  - tar
  - gzip
  - net-tools
  - procps
  - util-linux
  - cron
  - sudo
  - passwd
  - wget
  - curl
  base_tools:
  - ls, cat, cp, mv, rm, mkdir, rmdir, touch, echo, pwd, head, tail, sort, uniq
  - wc, cut, tr, tee, dd, df, du, chmod, chown, chgrp, ln, basename, dirname
  - readlink, stat, truncate, nproc, id, whoami, who, users, groups, env, printenv
  - date, sleep, seq, yes, test, expr, base64, md5sum, sha1sum, sha256sum, sha512sum
  - cksum, comm, fold, nl, od, paste, split, tac, mktemp, realpath, timeout, install
  - mkfifo, nice, nohup, printf, tty, uname, vdir, dir, arch, logname, shred, sync
  - mount, umount, fdisk, lsblk, blkid, dmesg, more, kill, mountpoint, hexdump
  - getopt, flock, renice, taskset, lscpu, lsmem, findmnt, rev, column, whereis
  - cal, last, su, login, fsck, mkswap, swapon, swapoff, uuidgen, namei, ionice
  - ps, top, free, pkill, pgrep, pmap, pwdx, sysctl, tload, uptime, vmstat, w, watch
  - ifconfig, netstat, route, arp, ip, ss, bridge, tc, nstat, ping, arping, tracepath
  - grep, egrep, fgrep, sed, awk, gawk, tar, gzip, gunzip, zcat, bzip2, bunzip2
  - xz, unxz, find, xargs, diff, cmp, file, less, nano, vi, hostname, which, logger
  - passwd, useradd, userdel, usermod, groupadd, gpasswd, chage, crontab, adduser
  - apt, apt-get, apt-cache, dpkg, dpkg-query, update-alternatives
  - systemctl, journalctl, loginctl, timedatectl, hostnamectl, sudo, sudoedit, service
  - bash, sh, ssh, scp, sftp, ssh-keygen, perl, python3, gpg, curl, wget, openssl
  - dig, nslookup, host, xxd, at, finger, ltrace, strace,busybox
  - iostat, pcre2-config, hciconfig, pidstat, tempfile, ibus, networkctl, getconf
  - lspci, lsusb, hashcat, getent, gsettings, listres, traceroute, lnstat, getfacl
  - getcap, kmod, linux-version, lshw, lsipc, p11-kit, pactl, routel, rpcinfo
  - lastlog, time, b2sum, cupsctl, gpgconf, iwconfig, laptop-detect
  users:
    root:
      uid: 0
      gid: 0
      home: /root
      shell: /bin/bash
    cocadmin:
      uid: 1001
      gid: 1001
      home: /home/cocadmin
      shell: /bin/bash
      gecos: COC Admin
    # uid/gid/home/shell as this Ubuntu 20.04 host really has them (getent
    # passwd). These accounts already exist in the base image, so the
    # generated Dockerfile skips creating them and the container keeps the
    # base image's values -- declaring anything else here only makes the
    # honeypot's /etc/passwd disagree with its own ground truth. The shells
    # were /bin/sh and are /usr/sbin/nologin; sshd was uid 101, which is
    # 22.04's, while 20.04 puts systemd-resolve there and sshd at 126.
    daemon:
      uid: 1
      gid: 1
      home: /usr/sbin
      shell: /usr/sbin/nologin
    bin:
      uid: 2
      gid: 2
      home: /bin
      shell: /usr/sbin/nologin
    www-data:
      uid: 33
      gid: 33
      home: /var/www
      shell: /usr/sbin/nologin
    nobody:
      uid: 65534
      gid: 65534
      home: /nonexistent
      shell: /usr/sbin/nologin
    sshd:
      uid: 126
      gid: 65534
      home: /run/sshd
      shell: /usr/sbin/nologin
  shadow:
    root: $6$4aOmWdpJ$/kyPOik9rR0kSLyABIYNXgg/UqlWX3c1eIaovOLWphShTGXmuUAMq6iu9DrcQqlVUw3Pirizns4u27w3Ugvb6.
  # Measured on the development host (Ubuntu 20.04.6) so a ground-truth
  # answer can be checked by hand in a terminal there. Three layers have to
  # agree for a tool: this block (what the honeypot answers), the image's
  # ground_truth.packages (what the container really runs), and the host
  # (what you can verify). They did not: the block declared 22.04 versions
  # for gcc/php/mysql while the image installs none of those, so the honeypot
  # answered "gcc ... 11.4.0" against a ground truth of
  # "bash: gcc: command not found".
  #
  # Tools the host does not have (php, nginx, tmux, emacs, mysql) are gone
  # from the list: with no entry the honeypot reports command-not-found,
  # which is what the host and the container both do.
  #
  # Three entries CANNOT match a plain ubuntu:20.04 container, because this
  # host carries newer builds than 20.04 ships -- python3 3.10.13 (a venv,
  # 20.04 ships 3.8.10), git 2.50.1 (20.04 ships 2.25.1) and node v20.20.2
  # (20.04 ships none). They are declared as the host has them; pin those
  # versions in the image, or expect those three to disagree.
  versions:
    nmap: Nmap version 7.80 ( https://nmap.org )
    python3: Python 3.10.13
    python: Python 3.10.13
    git: git version 2.50.1
    vim: VIM - Vi IMproved 8.1 (2018 May 18, compiled Apr 02 2025 16:39:51)
    gcc: gcc (Ubuntu 9.4.0-1ubuntu1~20.04.2) 9.4.0
    g++: g++ (Ubuntu 9.4.0-1ubuntu1~20.04.2) 9.4.0
    curl: curl 7.68.0 (x86_64-pc-linux-gnu)
    wget: GNU Wget 1.20.3 built on linux-gnu.
    perl: This is perl 5, version 30, subversion 0 (v5.30.0)
    ruby: ruby 2.7.0p0 (2019-12-25 revision 647ee6f091) [x86_64-linux-gnu]
    node: v20.20.2
    make: GNU Make 4.2.1
    htop: htop 2.2.0 - (C) 2004-2019 Hisham Muhammad
    screen: Screen version 4.08.00 (GNU) 05-Feb-20
    nano: GNU nano, version 4.8
  known_dirs:
  - /
  - /root
  - /home
  - /tmp
  - /var
  - /etc
  - /usr
  - /bin
  - /sbin
  - /proc
  - /sys
  - /dev
  - /opt
  - /srv
  - /mnt
  - /media
  - /run
  - /lib
  - /lib64
  - /boot
  - /var/tmp
  - /var/log
  - /var/run
  - /usr/bin
  - /usr/sbin
  - /usr/local
  tool_packages:
    nmap: nmap
    masscan: masscan
    ncat: nmap
    netcat: netcat-openbsd
    nc: netcat-openbsd
    tcpdump: tcpdump
    socat: socat
    whois: whois
    python: python3
    python3: python3
    python2: python2
    perl: perl
    ruby: ruby
    php: php
    node: nodejs
    lua: lua5.3
    gcc: gcc
    g++: g++
    make: make
    gdb: gdb
    git: git
    strace: strace
    nginx: nginx
    apache2: apache2
    mysql: mysql-server
    mysqldump: mysql-client
    redis-cli: redis-tools
    docker: docker.io
    vim: vim
    nano: nano
    emacs: emacs
    wget: wget
    curl: curl
    htop: htop
    screen: screen
    tmux: tmux
    zip: zip
    unzip: unzip
    7z: p7zip-full
    jq: jq
    tree: tree
  starting_files:
