# ═══════════════════════════════════════════════════════════════════════════════
# HydraPoT Configuration
# ═══════════════════════════════════════════════════════════════════════════════
# Generated by `hp init`. Edit directly or re-run `hp init` to reconfigure.

honeypot:
  hostname: psu
  os: Ubuntu 22.04 LTS
  host: 127.0.0.1
  port: 2223
agents:
  cowrie:
    enabled: true
    host: 127.0.0.1
    port: 2222
    username: root
    password: admin
  on_device:
    enabled: true
    model: unsloth/Qwen3.5-9B-GGUF
    quantization: 8bit
    gguf_file: Qwen3.5-9B-Q5_K_M.gguf
    temperature: 0
    max_tokens: 256
    do_sample: true
  cloud:
    enabled: true
    provider: openai
    model: nvidia/nemotron-3-super-120b-a12b:free
    api_key_env: OPENROUTER_API_KEY
    temperature: 0.1
    max_tokens: 2048
    base_url: https://openrouter.ai/api/v1
routing:
  fallback: cowrie
  fi_routing:
    0: cowrie
    1: on_device
    2: on_device
    3: cloud
    4: cloud
static_commands:
- nmap
- ping
- traceroute
- tracepath
- top
- htop
- watch
- tail
- vim
- vi
- nano
- emacs
- less
- more
logging:
  session_dir: data/logs/sessions
  impactful_dir: data/logs/impactful
  auth_log: data/logs/auth_log.json
  fi_threshold: 2
# MEA/PEA residential tariff (ประเภท 1.2) — Ft changes every 4 months, tiers
# occasionally revised by the ERC. Verify against
# https://www.mea.or.th/our-services/mea-service/e-service/electric-monthly-calculate
# before citing in the thesis.
power_tariff:
  tiers:
    - max_units: 15
      rate_thb_per_unit: 2.3488
    - max_units: 150
      rate_thb_per_unit: 3.2484
    - max_units: 400
      rate_thb_per_unit: 4.2218
    - max_units: null
      rate_thb_per_unit: 4.4217
  ft_surcharge_thb_per_unit: 0.1623
  vat_rate: 0.07
system_state:
  # Packages the OS ships with. These are seeded into SYSTEM_STATE["installed"]
  # at startup (main.py), so the LLM is told they are present — without this,
  # SRi reported no packages installed and the model answered
  # "wget: command not found" for tools that clearly exist.
  # They also mark the BASELINE: a package in "installed" but NOT listed here
  # was installed by the attacker during the session, which _needs_llm() treats
  # as interesting and routes to the LLM.
  pre_installed:
  - coreutils
  - bash
  - ssh
  - apt
  - apt-get
  - dpkg
  - grep
  - sed
  - awk
  - tar
  - gzip
  - net-tools
  - procps
  - util-linux
  - cron
  - sudo
  - passwd
  - wget
  - curl
  base_tools:
  - ls, cat, cp, mv, rm, mkdir, rmdir, touch, echo, pwd, head, tail, sort, uniq
  - wc, cut, tr, tee, dd, df, du, chmod, chown, chgrp, ln, basename, dirname
  - readlink, stat, truncate, nproc, id, whoami, who, users, groups, env, printenv
  - date, sleep, seq, yes, test, expr, base64, md5sum, sha1sum, sha256sum, sha512sum
  - cksum, comm, fold, nl, od, paste, split, tac, mktemp, realpath, timeout, install
  - mkfifo, nice, nohup, printf, tty, uname, vdir, dir, arch, logname, shred, sync
  - mount, umount, fdisk, lsblk, blkid, dmesg, more, kill, mountpoint, hexdump
  - getopt, flock, renice, taskset, lscpu, lsmem, findmnt, rev, column, whereis
  - cal, last, su, login, fsck, mkswap, swapon, swapoff, uuidgen, namei, ionice
  - ps, top, free, pkill, pgrep, pmap, pwdx, sysctl, tload, uptime, vmstat, w, watch
  - ifconfig, netstat, route, arp, ip, ss, bridge, tc, nstat, ping, arping, tracepath
  - grep, egrep, fgrep, sed, awk, gawk, tar, gzip, gunzip, zcat, bzip2, bunzip2
  - xz, unxz, find, xargs, diff, cmp, file, less, nano, vi, hostname, which, logger
  - passwd, useradd, userdel, usermod, groupadd, gpasswd, chage, crontab, adduser
  - apt, apt-get, apt-cache, dpkg, dpkg-query, update-alternatives
  - systemctl, journalctl, loginctl, timedatectl, hostnamectl, sudo, sudoedit, service
  - bash, sh, ssh, scp, sftp, ssh-keygen, perl, python3, gpg, curl, wget, openssl
  - dig, nslookup, host, xxd, at, finger, ltrace, strace,busybox
  - iostat, pcre2-config, hciconfig, pidstat, tempfile, ibus, networkctl, getconf
  - lspci, lsusb, hashcat, getent, gsettings, listres, traceroute, lnstat, getfacl
  - getcap, kmod, linux-version, lshw, lsipc, p11-kit, pactl, routel, rpcinfo
  - lastlog, time, b2sum, cupsctl, gpgconf, iwconfig, laptop-detect
  starting_files:
    /var/log:
      perms: drwxr-xr-x
      size: 4.0K
    /root/.bashrc:
      perms: -rw-r--r--
      size: 3.7K
    /root/.profile:
      perms: -rw-r--r--
      size: 161B
    /root/.bash_history:
      perms: -rw-------
      size: 0B
