  cloud_usd_per_cmd: 0.000449
power_tariff:
  tiers:
  - max_units: 15
    rate_thb_per_unit: 2.3488
  - max_units: 150
    rate_thb_per_unit: 3.2484
  - max_units: 400
    rate_thb_per_unit: 4.2218
  - max_units: null
    rate_thb_per_unit: 4.4217
  ft_surcharge_thb_per_unit: 0.1623
  vat_rate: 0.07
guardrail:
  enabled: true
  sanitize: true
  isolate: true
  # OUTPUT side, off for now: the guardrail overhead experiment measures the
  # PROMPT side on its own (detector score, fence, sanitise). validate re-reads
  # every answer and retry_on_break re-asks the model a second time, which is a
  # whole extra LLM call -- a separate experiment, not a term inside this one.
  # Turn both back on for deployment, and when measuring the output side.
  validate: false
  retry_on_break: false
  # Fence only what the detector flags. False fences EVERY prompt, which costs
  # prompt space on commands nothing is wrong with -- and makes guard-on send
  # the model different text than guard-off, so a measured "overhead" is the
  # model answering a rewritten prompt rather than the detector's own cost.
  fence_on_detect: true
  detector:
    enabled: true
    provider: llama
    model: meta-llama/Llama-Prompt-Guard-2-86M
    device: cpu
    threshold: 0.5
    log_path: data/logs/injections.jsonl
