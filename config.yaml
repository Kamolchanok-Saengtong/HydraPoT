      Cuda compilation tools, release 12.2, V12.2.140
      Build cuda_12.2.r12.2/compiler.33191640_0
  # Processes already running on the box; ps lists these plus the attacker's
  # own jobs. Copied from Cowrie's data so both agree on the base table.
  process_list: plugins/cowrie/processes.json
  # The NIC and what listens on it (shell/network.py). The address is the one the
  # attacker connected to; listeners are matched to the process table by name.
  network:
    interface: ens3
    mac: '52:54:00:3c:9a:71'      # 52:54:00 is QEMU/KVM's prefix
    prefix: 24
    listeners:
    - {proto: udp,  addr: 127.0.0.53, port: 53, process: systemd-resolved, comm: systemd-resolve, bound: lo}
    - {proto: udp,  addr: '{ip}',     port: 68, process: systemd-networkd, comm: systemd-network, bound: ens3}
    - {proto: tcp,  addr: 127.0.0.53, port: 53, process: systemd-resolved, comm: systemd-resolve, bound: lo}
    - {proto: tcp,  addr: 0.0.0.0,    port: 22, process: 'sshd -D',        comm: sshd}
    - {proto: tcp6, addr: '::',       port: 22, process: 'sshd -D',        comm: sshd}
  # The machine this honeypot claims to be, declared here: a container would report
  # the real host, so none of it is read from docker. kB. (shell/hardware.py)
  # ── THE MACHINE ────────────────────────────────────────────────────────────
  # Everything below is what an attacker sees: hardware, GPUs, users, files, processes.
  # Edit it, then run `hp --run`: it notices the change, rebuilds the fake filesystem and
  # restarts Cowrie by itself. Nothing is read from the computer HydraPoT runs on.
  #   hardware.cpu / cpus / gpus / memory_kb / disks   lscpu, /proc/cpuinfo, nvidia-smi, free, df
  #   users, groups                                    /etc/passwd, id, who, login history
  #   filesystem.dirs / filesystem.files               what ls and cat find (source: plugins/decoys/<file>)
  #   plugins/cowrie/processes.json                    what ps, top, htop list
