# ─── Project metadata ───────────────────────────────────────────────────────
[project]
name            = "HydraPoT"
version         = "1.0.0"
description     = "An Intelligent Honeypot Framework Using Large Language Models for Interactive Attack Analysis"
readme          = "README.md"
requires-python = ">=3.10"
authors         = [
    { name = "Kamolchanok Saengtong" },
]
license = { file = "license" }

# ─── Runtime dependencies ───────────────────────────────────────────────────
dependencies = [
    # SSH frontend
    "asyncssh>=2.14",
    "paramiko>=3.0",

    # LLM (on-device)
    "transformers>=4.40",
    "torch>=2.0",
    "accelerate>=0.27",
    # CUDA 4-bit/8-bit quantisation. Linux only: a macOS wheel exists but there
    # is no CUDA there to quantise on, and the GGUF path never uses it.
    "bitsandbytes>=0.43; sys_platform == 'linux'",
    "huggingface_hub>=0.23",

    # LLM (cloud)
    "openai>=1.30",
    "requests>=2.31",

    # CLI / wizard
    "click>=8.1",
    "rich>=13.7",
    "questionary>=2.0",
    "readchar>=4.1",

    # Config
    "PyYAML>=6.0",

    # Dashboard
    "dash>=2.16",
    "plotly>=5.18",
    "pandas>=2.0",
    "geoip2>=4.8",

    # Dashboard server. [standard] is required for the /ws/events WebSocket —
    # plain uvicorn starts, then fails the upgrade.
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "a2wsgi>=1.10",

    # Imported inside functions, so a missing one only shows when that path runs
    "matplotlib>=3.8",
    "psutil>=5.9",
]



# ─── Optional: the on-device GGUF responder ─────────────────────────────────
# llama-cpp-python publishes NO wheels, on any platform -- pip always compiles
# it, which needs a C++ toolchain (`xcode-select --install` on macOS,
# build-essential on Debian). Requiring that to install the dashboard made
# `pip install -e .` fail outright on a Mac, so it is opt-in:
#
#     pip install -e .                    dashboard, Cowrie, cloud agent
#     pip install -e ".[local-model]"     also the local GGUF responder
#
# Without it, set agents.on_device.enabled: false in config.yaml.
[project.optional-dependencies]
local-model = ["llama-cpp-python>=0.2.90"]

# ─── The `hp` command ───────────────────────────────────────────────────────
# After `pip install -e .`, the user can type `hp` in their terminal.
# It calls the `main()` function inside hp.py (root level).
[project.scripts]
hp = "cli.hp:main"

# ─── Build system ───────────────────────────────────────────────────────────
[build-system]
requires      = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

# ─── Tell setuptools where the modules live ─────────────────────────────────
# Code sits at the project root (no src/ layout), so top-level .py files are
# listed explicitly. Anything NOT listed here is missing after `pip install`,
# with no error until something imports it — that is how `dashboard` stayed
# listed after the file was deleted (which broke the install outright) while
# storage/geoip_fetch/api_server were never listed at all, so the dashboard's
# geolocation fetch would have failed on a real install.
[tool.setuptools]
py-modules = [
    "main",               # honeypot responder
    "config_loader",
    "ssh_server",
    "router",
    "storage",            # SQLite layer — imported by nearly everything
    "api_server",         # FastAPI + Dash host
]
# Found rather than listed: these have __init__.py and gain sub-packages
# regularly (api/v1, api/services, SIEM/pages), and a hand-written list silently
# drops a new one. Excludes keep test/experiment trees out of the wheel.
[tool.setuptools.packages.find]
include = ["agent_manager*", "prompt*", "plugins*", "threat_intel*",
           "SIEM*", "api*", "guardrail*", "shell*", "cost*", "cli*"]
exclude = ["tests*", "threat_intel.tests*", "experiment_data*", "archive_code*",
           "evaluation*", "honeypot_new*", "dataset*", "models*", "var*"]
# A real package is a directory with __init__.py. Left at the pyproject default
# (true) this becomes find_namespace and every data directory turns into an
# importable package -- plugins.cowrie.honeyfs.etc, threat_intel.rules.upstream
# and so on. Harmless to import, but it splits the package-data globs below:
# "rules/**/*.yml" is matched relative to the package that OWNS the file, so
# once threat_intel.rules is its own package the glob on threat_intel no longer
# reaches it and the rules silently stop shipping.
namespaces = false

# ─── Non-Python files the code reads at runtime ─────────────────────────────
# Without this the package installs and then fails at runtime: no detection
# rules, no MITRE catalog, no Cowrie filesystem.
#
# Two things are deliberately NOT here:
#   threat_intel/enterprise-attack.json  46 MB, and BUILD-time only — it is
#       parsed by mitre_mapper.build_catalog() to produce mitre_catalog.json
#       (20 KB), which is what runtime actually reads.
#   data/geoip.mmdb                      ~130 MB, downloaded on demand by
#       geoip_fetch.py into data/. Runtime state, not package content.
[tool.setuptools.package-data]
# The LLM's own prompt templates. prompt_manager.py reads these at startup, so
# without them the responder cannot build a single prompt.
prompt = ["templates/*.txt"]
threat_intel = [
    "rules/**/*.yml", "rules/**/*.yaml",
    "export/*.yml",
    "mitre_catalog.json",
    "alerts.yml",
]
plugins = [
    "rules/*.yml", "rules/*.yaml",
    "static/*.py",
    "cowrie/**/*",
]

# ─── Dependency drift check (deptry) ────────────────────────────────────────
# `deptry .` fails when an import isn't declared above — how fastapi, uvicorn
# and a2wsgi went missing and broke `hp --dashboard` on a clean install.
[tool.deptry]
# Regexes match the path without a leading "./", so each pattern names its
# own subtree
extend_exclude = [
    "honeypot_new/.*",
    "tests/.*", ".*/tests/.*",
    "experiment_data/.*", "archive_code/.*", "evaluation/.*",
    "dataset/.*", "models/.*", "var/.*",
    # Research code, never shipped — its stable_baselines3/gymnasium/peft/trl
    # are not runtime dependencies
    "honeyrouter/.*", "finetuning/.*",
    "tools/.*",
    "test.py", "measure.py", "debug_chmod_state.py",
]

# Import name != distribution name. Listing these lets deptry run without the
# dependencies installed, so CI never needs torch.
[tool.deptry.package_module_name_map]
PyYAML = ["yaml"]
llama-cpp-python = ["llama_cpp"]

[tool.deptry.per_rule_ignores]
# Imported by transformers/llama-cpp, not by our own code
DEP002 = ["torch", "accelerate", "bitsandbytes"]